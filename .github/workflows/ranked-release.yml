name: Release Corum Ranked
on:
  push:
    branches: [main]
    paths: ['ranked/**', 'corum-ranked-mod/**', 'apps-script/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
      deploy: ${{ steps.policy.outputs.deploy }}
      release: ${{ steps.policy.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      # Every main push deploys the server. One that changes the client
      # version first publishes its Debug package to R2 (activation waits for
      # it); one that keeps the version deploys as soon as validation and the
      # image are ready. No commit marker is needed.
      - id: version
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          version_of() { python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])'; }
          now="$(version_of < corum-ranked-mod/mod.json)"
          before=""
          if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            before="$(git show "${BEFORE}:corum-ranked-mod/mod.json" | version_of)"
          fi
          changed=false; [[ "$now" != "$before" ]] && changed=true
          printf 'Client version %s -> %s (changed=%s)\n' "${before:-none}" "$now" "$changed"
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
      - id: policy
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          PUBLISH: ${{ vars.RANKED_PUBLISH_R2 }}
          AUTO_DEPLOY: ${{ vars.LIGHTSAIL_AUTO_DEPLOY }}
          VERSION_CHANGED: ${{ steps.version.outputs.changed }}
        run: |
          python3 - <<'PY'
          import os
          # Markers count only in the subject line, so a body that merely
          # mentions one cannot switch a stage off.
          message = os.environ['MESSAGE'].split('\n', 1)[0]
          release = os.environ['EVENT'] == 'push' and os.environ.get('VERSION_CHANGED') == 'true'
          publish = '[build only]' not in message and (os.environ['PUBLISH'] == 'true' or '[publish-r2]' in message or '[deploy-lightsail]' in message or release)
          deploy = '[no-deploy]' not in message and (os.environ['EVENT'] in ('push', 'workflow_dispatch') or os.environ['AUTO_DEPLOY'] == 'true' or '[deploy-lightsail]' in message)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'publish={str(publish).lower()}\ndeploy={str(deploy).lower()}\nrelease={str(release).lower()}\n')
          PY
  # validate -> debug build -> debug publication -> Lightsail production.
  # Release builds and Debug-OFF validation are paused (pre-launch); the
  # Release workflow stays available through workflow_dispatch only.
  validation:
    uses: ./.github/workflows/ranked-ci.yml
    with:
      coordinated: true
  debug:
    uses: ./.github/workflows/build-ranked-debug.yml
    with:
      prepare_only: true
  image:
    needs: policy
    if: needs.policy.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the same source image while clients compile
        run: |
          docker build --pull --build-arg "CORUM_SOURCE_SHA=${GITHUB_SHA}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" -f ranked/Dockerfile.lightsail -t "corum-ranked:${GITHUB_SHA}" ranked
          docker save "corum-ranked:${GITHUB_SHA}" | gzip -1 > image.tar.gz
          sha256sum image.tar.gz > image.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: Corum-Ranked-Server-${{ github.sha }}
          path: image.tar.gz*
          retention-days: 1
          if-no-files-found: error
  publish-debug:
    needs: [policy, validation, debug]
    if: needs.policy.outputs.publish == 'true'
    uses: ./.github/workflows/publish-ranked-download.yml
    with:
      channel: debug
      version: ${{ needs.debug.outputs.version }}
      artifact: ${{ needs.debug.outputs.artifact }}
    secrets:
      r2_access_key_id: ${{ secrets.RANKED_R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.RANKED_R2_SECRET_ACCESS_KEY }}
  # A new client: activation (and its required version) waits for the
  # complete Debug build and its R2 publication.
  activate:
    needs: [policy, validation, debug, image, publish-debug]
    if: >-
      always() && needs.policy.outputs.deploy == 'true' && needs.policy.outputs.publish == 'true' &&
      needs.validation.result == 'success' &&
      needs.debug.result == 'success' && needs.image.result == 'success' &&
      needs.publish-debug.result == 'success'
    uses: ./.github/workflows/deploy-ranked-lightsail.yml
    with:
      coordinated: true
      mode: deploy
      prepared_image: Corum-Ranked-Server-${{ github.sha }}
    secrets: inherit
  # Same client version: deploy the server without waiting for the client
  # build. The deploy re-verifies that version's already-published packages
  # and fails when none is public.
  activate-server:
    needs: [policy, validation, image]
    if: >-
      always() && needs.policy.outputs.deploy == 'true' && needs.policy.outputs.publish != 'true' &&
      needs.validation.result == 'success' && needs.image.result == 'success'
    uses: ./.github/workflows/deploy-ranked-lightsail.yml
    with:
      coordinated: true
      mode: deploy
      prepared_image: Corum-Ranked-Server-${{ github.sha }}
    secrets: inherit
