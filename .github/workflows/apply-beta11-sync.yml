name: Apply Final Beta11 Sync

on:
  push:
    branches:
      - work/sync-beta11
    paths:
      - .github/workflows/apply-beta11-sync.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sync-beta11
      - name: Apply exact beta11 patch
        run: |
          git apply --check .github/beta11-sync.patch
          git apply .github/beta11-sync.patch
      - name: Commit applied source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corum-ranked-mod ranked
          git diff --cached --check
          git commit -m "chore: materialize final beta11 sync tree"
          git push origin HEAD:work/sync-beta11
