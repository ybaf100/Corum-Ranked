name: Patch Placement Realtime Grade CI Guard

on:
  push:
    branches:
      - work/placement-stage-session-results

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ci-guard-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update Placement CI invariant
        run: python .github/patch-placement-ci-guard.py

      - name: Remove verification-only files
        run: |
          rm -f .github/patch-placement-ci-guard.py
          rm -f .github/workflows/patch-placement-ci-guard.yml
          rm -f corum-ranked-mod/.ci-verify

      - name: Check patch
        run: git diff --check

      - name: Commit final worktree
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Placement realtime Grade CI invariants [ci-guard-applied]"
          git push origin HEAD:work/placement-stage-session-results
