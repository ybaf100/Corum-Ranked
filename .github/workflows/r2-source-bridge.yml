name: R2 Source Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-source:
    runs-on: ubuntu-latest

    steps:
      - name: Download latest source
        env:
          HANDOFF_TOKEN: ${{ secrets.HANDOFF_TOKEN }}
        run: |
          curl --fail --location \
            -H "Authorization: Bearer ${HANDOFF_TOKEN}" \
            "https://corum-ranked-handoff-api.gptcococo.workers.dev/object/source/latest.zip" \
            --output Corum-Ranked-latest.zip

      - name: Verify ZIP
        run: |
          unzip -t Corum-Ranked-latest.zip

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: corum-ranked-latest
          path: Corum-Ranked-latest.zip
          if-no-files-found: error
          retention-days: 1