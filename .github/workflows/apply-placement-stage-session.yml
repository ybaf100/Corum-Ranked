name: Apply Placement Stage Session Patch

on:
  push:
    branches:
      - work/placement-stage-session-results

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[placement-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ranked/package-lock.json

      - name: Prepare image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply requested Placement changes
        run: python .github/apply-placement-stage-session.py

      - name: Align changed Placement contracts in tests
        run: |
          sed -i 's/toBe(126\.5)/toBe(151.5)/' ranked/packages/rules/test/placement.test.ts
          python -c 'from pathlib import Path; p=Path("ranked/apps/server/test/placement-flow.integration.test.ts"); s=p.read_text(); old="provisionalMapScore: 225,\n      mapGrade: \"D\",\n      gradeChanged: false,"; new="provisionalMapScore: 225,\n      mapGrade: \"D\",\n      provisionalMapGrade: \"C\",\n      gradeChanged: true,"; assert old in s; s=s.replace(old,new,1); old2="provisionalMapScore: 275,\n      mapGrade: \"D\",\n      gradeChanged: false,"; new2="provisionalMapScore: 275,\n      mapGrade: \"D\",\n      provisionalMapGrade: \"B\",\n      gradeChanged: true,"; assert old2 in s; s=s.replace(old2,new2,1); s=s.replace("expect(progress.gradeChanged).toBe(false);", "expect(progress.gradeChanged).toBe(true);"); p.write_text(s)'

      - name: Verify whitespace
        run: git diff --check

      - name: Install Ranked dependencies
        working-directory: ranked
        run: npm ci

      - name: Run Ranked tests
        working-directory: ranked
        run: npm test

      - name: Run Ranked typecheck
        working-directory: ranked
        run: npm run typecheck

      - name: Commit verified implementation
        run: |
          rm -f .github/apply-placement-stage-session.py
          rm -f .github/workflows/apply-placement-stage-session.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Improve resumable placement results and live grades [placement-applied]"
          git push origin HEAD:work/placement-stage-session-results
