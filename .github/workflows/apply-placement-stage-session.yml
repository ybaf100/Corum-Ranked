name: Apply Placement Stage Session Patch

on:
  push:
    branches:
      - work/placement-stage-session-results

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[placement-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ranked/package-lock.json

      - name: Prepare image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply requested Placement changes
        run: python .github/apply-placement-stage-session.py

      - name: Align changed Placement contracts in tests
        run: |
          python - <<'PY'
          from pathlib import Path

          rules = Path("ranked/packages/rules/test/placement.test.ts")
          text = rules.read_text(encoding="utf-8")
          text = text.replace("expect(result.mapScore).toBe(126.5);", "expect(result.mapScore).toBe(151.5);")
          rules.write_text(text, encoding="utf-8")

          integration = Path("ranked/apps/server/test/placement-flow.integration.test.ts")
          text = integration.read_text(encoding="utf-8")
          old = '''      mapScore: 75,
                provisionalMapScore: 225,
                mapGrade: "D",
                gradeChanged: false,
          '''
          # Preserve source indentation by replacing the exact semantic block instead.
          old = '''      mapScore: 75,
                provisionalMapScore: 225,
                mapGrade: "D",
                gradeChanged: false,'''.replace("                ", "      ")
          new = '''      mapScore: 75,
      provisionalMapScore: 225,
      mapGrade: "D",
      provisionalMapGrade: "C",
      gradeChanged: true,'''
          if old not in text:
              raise SystemExit("Expected active Placement progress assertion was not found")
          integration.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify whitespace
        run: git diff --check

      - name: Install Ranked dependencies
        working-directory: ranked
        run: npm ci

      - name: Run Ranked tests
        working-directory: ranked
        run: npm test

      - name: Run Ranked typecheck
        working-directory: ranked
        run: npm run typecheck

      - name: Commit verified implementation
        run: |
          rm -f .github/apply-placement-stage-session.py
          rm -f .github/workflows/apply-placement-stage-session.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Improve resumable placement results and live grades [placement-applied]"
          git push origin HEAD:work/placement-stage-session-results
