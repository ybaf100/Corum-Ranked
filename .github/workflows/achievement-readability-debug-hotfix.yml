name: One-shot Achievement Readability and Debug Hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/achievement-readability-debug-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch achievement readability and Debug Bot achievement path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(text, old, new, label, count=1):
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{label}: expected {count} match(es), got {actual}')
              return text.replace(old, new, count)

          popup_path = Path('corum-ranked-mod/src/RankedPopup.cpp')
          popup = popup_path.read_text(encoding='utf-8')

          popup = replace_exact(
              popup,
              '''    auto* caption = corum::ranked::ui::label(\n        text,\n        0.38f,\n        {width / 2.0f, height / 2.0f},\n        selected ? kGold : (danger ? ccc3(255, 224, 229) : corum::ranked::ui::Text),\n        true\n    );\n    caption->limitLabelWidth(width - 20.0f, 0.38f, 0.24f);\n''',
              '''    auto* caption = corum::ranked::ui::label(\n        text,\n        0.62f,\n        {width / 2.0f, height / 2.0f},\n        selected ? kGold : (danger ? ccc3(255, 224, 229) : corum::ranked::ui::Text),\n        true\n    );\n    caption->limitLabelWidth(width - 20.0f, 0.62f, 0.30f);\n''',
              'shared action caption sizing',
          )
          popup = replace_exact(popup, 'englishVisual->setScale(0.43f);', 'englishVisual->setScale(0.48f);', 'English selector scale')
          popup = replace_exact(popup, 'koreanVisual->setScale(0.43f);', 'koreanVisual->setScale(0.48f);', 'Korean selector scale')
          popup = replace_exact(popup, 'historyVisual->setScale(0.62f);', 'historyVisual->setScale(0.66f);', 'History scale')
          popup = replace_exact(popup, 'trophyVisual->setScale(0.62f);', 'trophyVisual->setScale(0.66f);', 'Achievement top button scale')

          popup = replace_exact(
              popup,
              '''        auto* heading = makeLabel(\n            name,\n            0.45f,\n            {size.width / 2.0f, size.height / 2.0f + 62.0f},\n            achievementCardAccent(card),\n            "black"\n        );\n        heading->limitLabelWidth(320.0f, 0.45f, 0.28f);\n''',
              '''        auto* heading = makeLabel(\n            name,\n            0.50f,\n            {size.width / 2.0f, size.height / 2.0f + 62.0f},\n            achievementCardAccent(card),\n            "black"\n        );\n        heading->limitLabelWidth(320.0f, 0.50f, 0.32f);\n''',
              'title selector heading',
          )
          popup = replace_exact(
              popup,
              '''            tr("select-title-version", "SELECT ACHIEVEMENT TITLE VERSION"),\n            0.22f,\n            {size.width / 2.0f, size.height / 2.0f + 38.0f},\n''',
              '''            tr("select-title-version", "SELECT ACHIEVEMENT TITLE VERSION"),\n            0.30f,\n            {size.width / 2.0f, size.height / 2.0f + 38.0f},\n''',
              'title selector hint',
          )

          popup = replace_exact(
              popup,
              '''            kGold,\n            0.29f,\n            kGold,\n            "black"\n''',
              '''            kGold,\n            0.38f,\n            kGold,\n            "black"\n''',
              'AP plate text',
          )
          popup = replace_exact(
              popup,
              '''            view.achievements.unclaimedRewardCount > 0 ? kRed : kCyan,\n            0.25f,\n            view.achievements.unclaimedRewardCount > 0 ? ccc3(255, 225, 230) : corum::ranked::ui::Text,\n''',
              '''            view.achievements.unclaimedRewardCount > 0 ? kRed : kCyan,\n            0.34f,\n            view.achievements.unclaimedRewardCount > 0 ? ccc3(255, 225, 230) : corum::ranked::ui::Text,\n''',
              'claimable plate text',
          )
          popup = replace_exact(
              popup,
              '''                shorten(view.achievements.error, 72),\n                0.23f,\n                {size.width / 2.0f, 48.0f},\n''',
              '''                shorten(view.achievements.error, 72),\n                0.28f,\n                {size.width / 2.0f, 48.0f},\n''',
              'achievement error text',
          )
          popup = replace_exact(popup, '        constexpr float cardHeight = 78.0f;', '        constexpr float cardHeight = 88.0f;', 'achievement card height')
          popup = replace_exact(
              popup,
              '                size.height - 132.0f - static_cast<float>(row) * 88.0f,',
              '                size.height - 134.0f - static_cast<float>(row) * 94.0f,',
              'achievement card row spacing',
          )
          popup = replace_exact(
              popup,
              '''            auto const title = card.type == "PROGRESSIVE" && card.currentLevel > 0\n                ? fmt::format("{} - {}", baseName, card.displayLabel)\n                : baseName;\n            auto* titleLabel = makeLabel(\n                title,\n                0.29f,\n                {center.x - cardWidth / 2.0f + 10.0f, center.y + 25.0f},\n                accent,\n                "semibold",\n                {0.0f, 0.5f}\n            );\n            titleLabel->limitLabelWidth(cardWidth - 82.0f, 0.29f, 0.19f);\n''',
              '''            auto const title = card.type == "PROGRESSIVE" && card.currentLevel > 0\n                ? fmt::format("{} - {}", baseName, card.displayLabel)\n                : baseName;\n            auto const titleColor =\n                card.unlocked || card.currentLevel > 0\n                    ? accent\n                    : corum::ranked::ui::Text;\n            auto* titleLabel = makeLabel(\n                title,\n                0.40f,\n                {center.x - cardWidth / 2.0f + 10.0f, center.y + 27.0f},\n                titleColor,\n                "semibold",\n                {0.0f, 0.5f}\n            );\n            titleLabel->limitLabelWidth(cardWidth - 82.0f, 0.40f, 0.26f);\n''',
              'achievement card title',
          )
          popup = replace_exact(
              popup,
              '''                shorten(description, corum::ranked::i18n::isKorean() ? 46 : 58),\n                0.17f,\n                {center.x - cardWidth / 2.0f + 10.0f, center.y + 7.0f},\n                corum::ranked::ui::TextMuted,\n                "medium",\n                {0.0f, 0.5f}\n            );\n            descriptionLabel->limitLabelWidth(cardWidth - 90.0f, 0.17f, 0.12f);\n''',
              '''                shorten(description, corum::ranked::i18n::isKorean() ? 40 : 52),\n                0.25f,\n                {center.x - cardWidth / 2.0f + 10.0f, center.y + 7.0f},\n                ccc3(192, 205, 224),\n                "medium",\n                {0.0f, 0.5f}\n            );\n            descriptionLabel->limitLabelWidth(cardWidth - 90.0f, 0.25f, 0.19f);\n''',
              'achievement description',
          )
          popup = replace_exact(
              popup,
              '''                progressText,\n                0.21f,\n                {center.x - cardWidth / 2.0f + 10.0f, center.y - 11.0f},\n''',
              '''                progressText,\n                0.30f,\n                {center.x - cardWidth / 2.0f + 10.0f, center.y - 13.0f},\n''',
              'achievement progress label',
          )
          popup = replace_exact(
              popup,
              '            progressLabel->limitLabelWidth(cardWidth - 92.0f, 0.21f, 0.13f);',
              '            progressLabel->limitLabelWidth(cardWidth - 92.0f, 0.30f, 0.21f);',
              'achievement progress label limits',
          )
          popup = replace_exact(popup, '            barBack->setContentSize({cardWidth - 92.0f, 6.0f});', '            barBack->setContentSize({cardWidth - 92.0f, 7.0f});', 'achievement bar background height')
          popup = replace_exact(popup, '            barBack->setPosition({center.x - cardWidth / 2.0f + 10.0f, center.y - 30.0f});', '            barBack->setPosition({center.x - cardWidth / 2.0f + 10.0f, center.y - 34.0f});', 'achievement bar position')
          popup = replace_exact(popup, '            barFill->setContentSize({static_cast<float>((cardWidth - 92.0f) * progress), 6.0f});', '            barFill->setContentSize({static_cast<float>((cardWidth - 92.0f) * progress), 7.0f});', 'achievement bar fill height')

          popup = replace_exact(
              popup,
              '''                menu_selector(CorumRankedLayer::onAchievementClaim),\n                false,\n                0.44f\n''',
              '''                menu_selector(CorumRankedLayer::onAchievementClaim),\n                false,\n                0.50f\n''',
              'achievement claim button',
          )
          popup = replace_exact(
              popup,
              '''                menu_selector(CorumRankedLayer::onAchievementTitle),\n                false,\n                0.44f\n''',
              '''                menu_selector(CorumRankedLayer::onAchievementTitle),\n                false,\n                0.50f\n''',
              'achievement title button',
          )
          popup = replace_exact(
              popup,
              '''                menu_selector(CorumRankedLayer::onAchievementPrevious),\n                false,\n                0.46f\n''',
              '''                menu_selector(CorumRankedLayer::onAchievementPrevious),\n                false,\n                0.52f\n''',
              'achievement previous button',
          )
          popup = replace_exact(
              popup,
              '''                menu_selector(CorumRankedLayer::onAchievementNext),\n                false,\n                0.46f\n''',
              '''                menu_selector(CorumRankedLayer::onAchievementNext),\n                false,\n                0.52f\n''',
              'achievement next button',
          )
          popup = replace_exact(
              popup,
              '''                fmt::format("{} / {}", m_achievementPage + 1, pageCount),\n                0.24f,\n                {size.width / 2.0f, 20.0f},\n''',
              '''                fmt::format("{} / {}", m_achievementPage + 1, pageCount),\n                0.32f,\n                {size.width / 2.0f, 20.0f},\n''',
              'achievement page label',
          )
          popup_path.write_text(popup, encoding='utf-8')

          source_test_path = Path('corum-ranked-mod/tests/AchievementSourceTest.mjs')
          source_test = source_test_path.read_text(encoding='utf-8')
          old_test = '''test('Achievement action buttons keep the native-readable hotfix sizing', () => {\n    const selector = body(popup, 'void renderAchievementTitleSelector(', 'void renderAchievements(');\n    const achievements = body(popup, 'void renderAchievements(', 'void renderHistoryList(');\n\n    assert.match(selector, /static_cast<float>\\(level - 1\\) \\* 72\\.0f/);\n    assert.match(selector, /onAchievementTitleLevel[\\s\\S]{0,120}0\\.52f/);\n    assert.match(selector, /onAchievementTitleClear[\\s\\S]{0,120}0\\.56f/);\n    assert.match(selector, /onAchievementTitleSelectorClose[\\s\\S]{0,120}0\\.56f/);\n\n    assert.match(achievements, /onAchievementClaim[\\s\\S]{0,120}0\\.44f/);\n    assert.match(achievements, /onAchievementTitle\\)[\\s\\S]{0,120}0\\.44f/);\n    assert.match(achievements, /onAchievementPrevious[\\s\\S]{0,120}0\\.46f/);\n    assert.match(achievements, /onAchievementNext[\\s\\S]{0,120}0\\.46f/);\n});\n'''
          new_test = '''test('Lobby and Achievement text keep native-readable sizing', () => {\n    const actionVisual = body(popup, 'CCNode* makeActionButtonVisual(', 'std::string resourceKey(');\n    const language = body(popup, 'void addLanguageSelector()', 'void addStatusPill(');\n    const main = body(popup, 'void renderMain(', 'void renderPlacementMap(');\n    const selector = body(popup, 'void renderAchievementTitleSelector(', 'void renderAchievements(');\n    const achievements = body(popup, 'void renderAchievements(', 'void renderHistoryList(');\n\n    assert.match(actionVisual, /text,\\s*0\\.62f/);\n    assert.match(actionVisual, /limitLabelWidth\\(width - 20\\.0f, 0\\.62f, 0\\.30f\\)/);\n    assert.equal((language.match(/setScale\\(0\\.48f\\)/g) ?? []).length, 2);\n    assert.equal((main.match(/setScale\\(0\\.66f\\)/g) ?? []).length, 2);\n\n    assert.match(selector, /static_cast<float>\\(level - 1\\) \\* 72\\.0f/);\n    assert.match(selector, /onAchievementTitleLevel[\\s\\S]{0,120}0\\.52f/);\n    assert.match(selector, /onAchievementTitleClear[\\s\\S]{0,120}0\\.56f/);\n    assert.match(selector, /onAchievementTitleSelectorClose[\\s\\S]{0,120}0\\.56f/);\n\n    assert.match(achievements, /constexpr float cardHeight = 88\\.0f/);\n    assert.match(achievements, /title,\\s*0\\.40f/);\n    assert.match(achievements, /shorten\\(description[\\s\\S]{0,120}0\\.25f/);\n    assert.match(achievements, /progressText,\\s*0\\.30f/);\n    assert.match(achievements, /onAchievementClaim[\\s\\S]{0,120}0\\.50f/);\n    assert.match(achievements, /onAchievementTitle\\)[\\s\\S]{0,120}0\\.50f/);\n    assert.match(achievements, /onAchievementPrevious[\\s\\S]{0,120}0\\.52f/);\n    assert.match(achievements, /onAchievementNext[\\s\\S]{0,120}0\\.52f/);\n});\n'''
          source_test = replace_exact(source_test, old_test, new_test, 'Achievement source readability test')
          source_test_path.write_text(source_test, encoding='utf-8')

          match_path = Path('ranked/apps/server/src/match/match.service.ts')
          match = match_path.read_text(encoding='utf-8')
          match = replace_exact(
              match,
              '''    let achievementUnlocks: Readonly<Record<string, readonly unknown[]>> = {};\n    if (current.match_type === "RANKED_PVP") {\n''',
              '''    let achievementUnlocks: Readonly<Record<string, readonly unknown[]>> = {};\n    // Debug Bot is the development harness for the production result path.\n    // When explicitly enabled, it must exercise Achievement progression too so\n    // Force Win/Lose and natural Bot Matches can validate the same server-side\n    // metrics, unlocks, and Claim flow without changing real PvP authority.\n    if (current.match_type === "RANKED_PVP" || current.match_type === "DEBUG_BOT") {\n''',
              'Debug Bot Achievement eligibility',
          )
          match_path.write_text(match, encoding='utf-8')

          debug_test_path = Path('ranked/apps/server/test/debug-bot.integration.test.ts')
          debug_test = debug_test_path.read_text(encoding='utf-8')
          debug_test = replace_exact(
              debug_test,
              '''    expect(Number(stored.rows[0]?.wins)).toBe(expectedWins);\n    expect(Number(stored.rows[0]?.losses)).toBe(expectedLosses);\n    expect(stored.rows[0]?.placement_results).toEqual([]);\n  });\n''',
              '''    expect(Number(stored.rows[0]?.wins)).toBe(expectedWins);\n    expect(Number(stored.rows[0]?.losses)).toBe(expectedLosses);\n    expect(stored.rows[0]?.placement_results).toEqual([]);\n\n    const achievementMetrics = await database.query<{\n      ranked_wins: number;\n      ranked_matches: number;\n    }>(\n      `SELECT ranked_wins, ranked_matches\n       FROM ranked_achievement_metrics WHERE player_id = $1`,\n      [player.playerId],\n    );\n    expect(Number(achievementMetrics.rows[0]?.ranked_matches)).toBe(1);\n    expect(Number(achievementMetrics.rows[0]?.ranked_wins)).toBe(expectedWins);\n  });\n''',
              'Debug Force Win/Lose Achievement regression test',
          )
          debug_test_path.write_text(debug_test, encoding='utf-8')
          PY

          node --test corum-ranked-mod/tests/AchievementSourceTest.mjs
          git diff --check

      - name: Commit hotfix and remove one-shot runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/achievement-readability-debug-hotfix.yml
          git add \
            corum-ranked-mod/src/RankedPopup.cpp \
            corum-ranked-mod/tests/AchievementSourceTest.mjs \
            ranked/apps/server/src/match/match.service.ts \
            ranked/apps/server/test/debug-bot.integration.test.ts
          git commit -m "fix(achievements): improve readability and debug coverage"
          git push origin HEAD:main
