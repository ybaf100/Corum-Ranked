name: CI Log Relay

on:
  workflow_run:
    workflows:
      - "Validate Corum Ranked"
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest

    steps:
      - name: Download workflow logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${RUN_ID}/logs" \
            --output logs.zip

          mkdir logs
          unzip -q logs.zip -d logs

      - name: Build complete log
        run: |
          {
            echo "Repository: ${{ github.repository }}"
            echo "Run ID: ${{ github.event.workflow_run.id }}"
            echo "Commit SHA: ${{ github.event.workflow_run.head_sha }}"
            echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
            echo ""
            echo "========================================"
            echo ""

            find logs -type f -name "*.txt" -print0 |
              sort -z |
              xargs -0 -I{} sh -c '
                echo
                echo "===== {} ====="
                cat "{}"
              '
          } > latest-actions-error.log

      - name: Build summary
        run: |
          {
            echo "# GitHub Actions Result"
            echo
            echo "- Status: ${{ github.event.workflow_run.conclusion }}"
            echo "- Repository: ${{ github.repository }}"
            echo "- Workflow: ${{ github.event.workflow_run.name }}"
            echo "- Run ID: ${{ github.event.workflow_run.id }}"
            echo "- Commit SHA: ${{ github.event.workflow_run.head_sha }}"
            echo "- Branch: ${{ github.event.workflow_run.head_branch }}"
          } > latest-actions-summary.md

      - name: Upload results to R2
        env:
          HANDOFF_TOKEN: ${{ secrets.HANDOFF_TOKEN }}
        run: |
          curl --fail \
            -H "Authorization: Bearer ${HANDOFF_TOKEN}" \
            -F "key=ci/latest-actions-summary.md" \
            -F "file=@latest-actions-summary.md;type=text/markdown" \
            "https://corum-ranked-handoff-api.gptcococo.workers.dev/upload"

          curl --fail \
            -H "Authorization: Bearer ${HANDOFF_TOKEN}" \
            -F "key=ci/latest-actions-error.log" \
            -F "file=@latest-actions-error.log;type=text/plain" \
            "https://corum-ranked-handoff-api.gptcococo.workers.dev/upload"