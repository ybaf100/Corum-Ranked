name: One-shot Achievement Button Hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/achievement-button-hotfix.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Achievement action sizing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('corum-ranked-mod/src/RankedPopup.cpp')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''                {size.width / 2.0f - 128.0f + static_cast<float>(level - 1) * 64.0f,\n                 size.height / 2.0f},\n                menu_selector(CorumRankedLayer::onAchievementTitleLevel),\n                false,\n                0.42f\n''',
                  '''                {size.width / 2.0f - 144.0f + static_cast<float>(level - 1) * 72.0f,\n                 size.height / 2.0f},\n                menu_selector(CorumRankedLayer::onAchievementTitleLevel),\n                false,\n                0.52f\n''',
              ),
              (
                  '''            menu_selector(CorumRankedLayer::onAchievementTitleClear),\n            true,\n            0.44f\n''',
                  '''            menu_selector(CorumRankedLayer::onAchievementTitleClear),\n            true,\n            0.56f\n''',
              ),
              (
                  '''            menu_selector(CorumRankedLayer::onAchievementTitleSelectorClose),\n            false,\n            0.44f\n''',
                  '''            menu_selector(CorumRankedLayer::onAchievementTitleSelectorClose),\n            false,\n            0.56f\n''',
              ),
              (
                  '''                menu_selector(CorumRankedLayer::onAchievementClaim),\n                false,\n                0.31f\n''',
                  '''                menu_selector(CorumRankedLayer::onAchievementClaim),\n                false,\n                0.44f\n''',
              ),
              (
                  '''                menu_selector(CorumRankedLayer::onAchievementTitle),\n                false,\n                0.31f\n''',
                  '''                menu_selector(CorumRankedLayer::onAchievementTitle),\n                false,\n                0.44f\n''',
              ),
              (
                  '''                menu_selector(CorumRankedLayer::onAchievementPrevious),\n                false,\n                0.34f\n''',
                  '''                menu_selector(CorumRankedLayer::onAchievementPrevious),\n                false,\n                0.46f\n''',
              ),
              (
                  '''                menu_selector(CorumRankedLayer::onAchievementNext),\n                false,\n                0.34f\n''',
                  '''                menu_selector(CorumRankedLayer::onAchievementNext),\n                false,\n                0.46f\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          node --test corum-ranked-mod/tests/AchievementSourceTest.mjs
          git diff --check

      - name: Commit hotfix and remove one-shot runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/achievement-button-hotfix.yml
          git add corum-ranked-mod/src/RankedPopup.cpp
          git commit -m "fix(achievements): enlarge action button text"
          git push origin HEAD:main
