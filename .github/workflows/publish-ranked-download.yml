name: Publish Ranked package to R2
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      version:
        required: true
        type: string
      artifact:
        required: true
        type: string
    secrets:
      r2_access_key_id:
        required: true
      r2_secret_access_key:
        required: true
permissions:
  contents: read
concurrency:
  group: ranked-r2-${{ inputs.channel }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact }}
          path: downloads
      - name: Publish immutable package and descriptor to R2
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          RANKED_R2_ACCOUNT_ID: ${{ vars.RANKED_R2_ACCOUNT_ID }}
          RANKED_R2_BUCKET: ${{ vars.RANKED_R2_BUCKET || 'corum-ranked-download' }}
          RANKED_DOWNLOAD_BASE_URL: ${{ vars.RANKED_DOWNLOAD_BASE_URL }}
          RANKED_R2_ACCESS_KEY_ID: ${{ secrets.r2_access_key_id }}
          RANKED_R2_SECRET_ACCESS_KEY: ${{ secrets.r2_secret_access_key }}
        shell: bash
        run: python3 corum-ranked-mod/tools/publish-mod-r2.py downloads "$CHANNEL" "$VERSION"
