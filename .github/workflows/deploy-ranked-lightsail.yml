name: Deploy Corum Ranked to Lightsail

on:
  push:
    branches: [main]
    paths:
      - 'ranked/**'
      - '.github/workflows/deploy-ranked-lightsail.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'SSH connectivity check only, or actual deployment'
        type: choice
        required: true
        default: check-only
        options:
          - check-only
          - deploy

permissions:
  contents: read

concurrency:
  group: ranked-lightsail-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Push deployment stays OFF until manually tested and LIGHTSAIL_AUTO_DEPLOY=true.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.LIGHTSAIL_AUTO_DEPLOY == 'true')
    runs-on: ubuntu-24.04
    environment: lightsail-production
    timeout-minutes: 35
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4

      - name: Configure pinned SSH key
        env:
          LIGHTSAIL_SSH_PRIVATE_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY_B64 }}
          LIGHTSAIL_SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
        run: |
          if [[ -z "$LIGHTSAIL_SSH_PRIVATE_KEY_B64" ]]; then
            echo "::error::Missing LIGHTSAIL_SSH_PRIVATE_KEY_B64. Set this environment secret to the single-line base64 of the OpenSSH private key."
            exit 1
          fi
          test -n "$LIGHTSAIL_SSH_KNOWN_HOSTS"
          test -n "$LIGHTSAIL_HOST"
          umask 077
          mkdir -p "$HOME/.ssh"
          if ! printf '%s' "$LIGHTSAIL_SSH_PRIVATE_KEY_B64" | base64 --decode > "$HOME/.ssh/corum-lightsail"; then
            echo "::error::SSH key secret is not valid base64; recopy it as a single line without spaces."
            exit 1
          fi
          printf '%s\n' "$LIGHTSAIL_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/corum-lightsail" "$HOME/.ssh/known_hosts"
          if ! ssh-keygen -y -P '' -f "$HOME/.ssh/corum-lightsail" > /dev/null 2>&1; then
            echo "::error::Decoded SSH private key is invalid or passphrase-protected. Re-encode the original key from the Lightsail server."
            exit 1
          fi

      - name: Verify deployment user SSH access (no changes)
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
        run: |
          ssh_opts=(-i "$HOME/.ssh/corum-lightsail" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          test "$(ssh "${ssh_opts[@]}" "corum-deploy@${LIGHTSAIL_HOST}" whoami)" = corum-deploy

      - name: Build server Docker image on GitHub runner
        if: github.event_name == 'push' || inputs.mode == 'deploy'
        run: |
          docker build --pull -f ranked/Dockerfile.lightsail -t "corum-ranked:${GITHUB_SHA}" ranked
          docker save "corum-ranked:${GITHUB_SHA}" | gzip -1 > "/tmp/corum-ranked-${GITHUB_SHA}.tar.gz"

      - name: Upload immutable image and activate with rollback
        if: github.event_name == 'push' || inputs.mode == 'deploy'
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
        run: |
          ssh_opts=(-i "$HOME/.ssh/corum-lightsail" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          scp "${ssh_opts[@]}" "/tmp/corum-ranked-${GITHUB_SHA}.tar.gz" "corum-deploy@${LIGHTSAIL_HOST}:/var/lib/corum-ranked/incoming/${GITHUB_SHA}.tar.gz"
          ssh "${ssh_opts[@]}" "corum-deploy@${LIGHTSAIL_HOST}" "sudo /usr/local/sbin/corum-ranked-activate '${GITHUB_SHA}'"

      - name: Report deployment source
        if: github.event_name == 'push' || inputs.mode == 'deploy'
        run: echo "Deployed ${GITHUB_SHA} via pinned SSH to Lightsail"
