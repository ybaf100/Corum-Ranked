name: Deploy Corum Ranked to Lightsail

on:
  workflow_call:
    inputs:
      coordinated:
        type: boolean
        default: false
      mode:
        type: string
        default: deploy
      prepared_image:
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'ranked/**'
      - 'corum-ranked-mod/**'
      - '.github/workflows/deploy-ranked-lightsail.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'SSH connectivity check only, or actual deployment'
        type: choice
        required: true
        default: check-only
        options:
          - check-only
          - deploy

permissions:
  contents: read

jobs:
  validation:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' && !inputs.coordinated
    uses: ./.github/workflows/ranked-ci.yml
    with:
      coordinated: true
  native-validation:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' && !inputs.coordinated
    uses: ./.github/workflows/ranked-native.yml
  build-and-deploy:
    concurrency:
      group: ranked-lightsail-production
      cancel-in-progress: false
    # [no-deploy] explicitly suppresses a push during a staged client/DB rollout.
    # An operator-marked [deploy-lightsail] push triggers one full deploy; ordinary pushes stay gated.
    needs: [validation, native-validation]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (inputs.coordinated || (github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'check-only' || (needs.validation.result == 'success' && needs.native-validation.result == 'success'))))
    runs-on: ubuntu-24.04
    environment: lightsail-production
    timeout-minutes: 60
    outputs:
      activated: ${{ steps.activation.outputs.activated }}
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4

      - name: Configure pinned SSH key
        env:
          LIGHTSAIL_SSH_PRIVATE_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY_B64 }}
          LIGHTSAIL_SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
        run: |
          if [[ -z "$LIGHTSAIL_SSH_PRIVATE_KEY_B64" ]]; then
            echo "::error::Missing LIGHTSAIL_SSH_PRIVATE_KEY_B64. Set this environment secret to the single-line base64 of the OpenSSH private key."
            exit 1
          fi
          test -n "$LIGHTSAIL_SSH_KNOWN_HOSTS"
          test -n "$LIGHTSAIL_HOST"
          if [[ "$LIGHTSAIL_HOST" != "52.74.37.130" ]]; then
            echo "::error::Singapore migration: configure lightsail-production LIGHTSAIL_HOST=52.74.37.130; Seoul deployment is blocked."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          if ! printf '%s' "$LIGHTSAIL_SSH_PRIVATE_KEY_B64" | base64 --decode > "$HOME/.ssh/corum-lightsail"; then
            echo "::error::SSH key secret is not valid base64; recopy it as a single line without spaces."
            exit 1
          fi
          printf '%s\n' "$LIGHTSAIL_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/corum-lightsail" "$HOME/.ssh/known_hosts"
          if ! ssh-keygen -y -P '' -f "$HOME/.ssh/corum-lightsail" > /dev/null 2>&1; then
            echo "::error::Decoded SSH private key is invalid or passphrase-protected. Re-encode the original key from the Lightsail server."
            exit 1
          fi

      - name: Verify deployment user SSH access (no changes)
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
        run: |
          ssh_opts=(-i "$HOME/.ssh/corum-lightsail" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          test "$(ssh "${ssh_opts[@]}" "corum-deploy@${LIGHTSAIL_HOST}" whoami)" = corum-deploy

      - uses: actions/download-artifact@v7
        if: inputs.prepared_image != ''
        with:
          name: ${{ inputs.prepared_image }}
          path: prepared-image
      - name: Verify immutable prepared image bytes
        if: inputs.prepared_image != ''
        run: |
          (cd prepared-image && sha256sum --check image.tar.gz.sha256)
          cp prepared-image/image.tar.gz "/tmp/corum-ranked-${GITHUB_SHA}.tar.gz"

      - name: Build server Docker image on GitHub runner
        if: inputs.mode == 'deploy' && inputs.prepared_image == ''
        run: |
          docker build --pull --build-arg "CORUM_SOURCE_SHA=${GITHUB_SHA}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" -f ranked/Dockerfile.lightsail -t "corum-ranked:${GITHUB_SHA}" ranked
          docker save "corum-ranked:${GITHUB_SHA}" | gzip -1 > "/tmp/corum-ranked-${GITHUB_SHA}.tar.gz"

      - name: Verify published clients before required-version activation
        if: inputs.mode == 'deploy'
        env:
          RANKED_DOWNLOAD_BASE_URL: ${{ vars.RANKED_DOWNLOAD_BASE_URL || 'https://pub-11442f32945446a49b9da0a5e69f2451.r2.dev' }}
        run: |
          python3 -m unittest discover -s ranked/tools/tests -p 'test_published_clients.py'
          version="$(python3 -c 'import json; print(json.load(open("corum-ranked-mod/mod.json"))["version"])')"
          python3 ranked/tools/verify-published-clients.py --base "$RANKED_DOWNLOAD_BASE_URL" --version "$version" --wait-seconds 0 --expected-sha "$GITHUB_SHA"

      - name: Reject superseded source immediately before activation
        id: fresh
        if: inputs.mode == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Superseded source $GITHUB_SHA; current main is $latest. Production unchanged."
          else
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload immutable image and activate with rollback
        id: activation
        if: steps.fresh.outputs.current == 'true'
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ssh_opts=(-i "$HOME/.ssh/corum-lightsail" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          # Package integrity and the same-source image label are checked before
          # contacting the restricted host activation entry point.
          gzip -dc "/tmp/corum-ranked-${GITHUB_SHA}.tar.gz" | docker load > /dev/null
          test "$(docker image inspect "corum-ranked:${GITHUB_SHA}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          active="$(curl --fail --silent --show-error --max-time 20 https://api.52-74-37-130.sslip.io/health | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sourceSha", ""))')"
          if [[ "$active" == "$GITHUB_SHA" ]]; then
            echo 'activated=true' >> "$GITHUB_OUTPUT"
            echo 'Same source is already active; verify without restarting it.'
            exit 0
          fi
          scp "${ssh_opts[@]}" "/tmp/corum-ranked-${GITHUB_SHA}.tar.gz" "corum-deploy@${LIGHTSAIL_HOST}:/var/lib/corum-ranked/incoming/${GITHUB_SHA}.tar.gz"
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo 'activated=false' >> "$GITHUB_OUTPUT"
            echo "Source superseded during image upload; skip activation."
            exit 0
          fi
          ssh "${ssh_opts[@]}" "corum-deploy@${LIGHTSAIL_HOST}" "sudo /usr/local/sbin/corum-ranked-activate '${GITHUB_SHA}'"

          echo 'activated=true' >> "$GITHUB_OUTPUT"

      - name: Report deployment source
        if: steps.activation.outputs.activated == 'true'
        run: echo "Deployed ${GITHUB_SHA} via pinned SSH to Lightsail"

      - name: Verify public Singapore readiness, required version and both client hashes
        if: steps.activation.outputs.activated == 'true'
        env:
          RANKED_DOWNLOAD_BASE_URL: ${{ vars.RANKED_DOWNLOAD_BASE_URL || 'https://pub-11442f32945446a49b9da0a5e69f2451.r2.dev' }}
        run: python3 ranked/tools/verify-production-release.py --expected-sha "$GITHUB_SHA"

  prepare-image:
    # Staged client releases validate Docker immediately without SSH or activation.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-r2]') && contains(github.event.head_commit.message, '[no-deploy]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout staged source
        uses: actions/checkout@v4
      - name: Prepare server image without production access
        run: docker build --pull --build-arg "CORUM_SOURCE_SHA=${GITHUB_SHA}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" -f ranked/Dockerfile.lightsail -t "corum-ranked-preflight:${GITHUB_SHA}" ranked
