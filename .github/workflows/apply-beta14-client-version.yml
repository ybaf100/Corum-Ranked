name: Apply beta14 client version

on:
  push:
    branches: [beta14-followup-work]
    paths: [.github/workflows/apply-beta14-client-version.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta14-followup-work
          fetch-depth: 0
      - name: Bump client manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('corum-ranked-mod/mod.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          if data.get('version') != 'v0.5.0-beta.13':
              raise SystemExit(f'unexpected source client version: {data.get("version")}')
          data['version'] = 'v0.5.0-beta.14'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/apply-beta14-client-version.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(release): bump client to v0.5.0-beta.14"
          git push origin HEAD:beta14-followup-work
