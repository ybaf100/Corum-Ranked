name: Apply beta14 Death Match HUD contract

on:
  push:
    branches: [beta14-followup-work]
    paths: [.github/workflows/apply-beta14-dm-hud-contract.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta14-followup-work
          fetch-depth: 0
      - name: Align implementation and domain tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'corum-ranked-mod/src/domain/HudPresentation.cpp',
              '''    result.deathmatch = input.deathmatch;\n    result.qualifyingVisible = !input.deathmatch;''',
              '''    result.deathmatch = input.deathmatch;\n    if (input.deathmatch) {\n        auto const ownUsed = ownIsA\n            ? input.deathmatchAttemptsUsedA\n            : input.deathmatchAttemptsUsedB;\n        auto const opponentUsed = ownIsA\n            ? input.deathmatchAttemptsUsedB\n            : input.deathmatchAttemptsUsedA;\n        result.ownAttemptText = "Attempts : " +\n            std::to_string(std::clamp(ownUsed, 0, 3)) + "/3";\n        result.opponentAttemptText = "Attempts : " +\n            std::to_string(std::clamp(opponentUsed, 0, 3)) + "/3";\n    }\n    result.qualifyingVisible = !input.deathmatch;'''
          )

          replace_once(
              'corum-ranked-mod/tests/DomainTest.cpp',
              '''    input.deathmatchAttemptsUsedA = 3;\n    input.deathmatchAttemptsUsedB = 2;\n    input.spectatorActive = false;\n    hud = presentHud(input);\n    assert(hud.stateText == "DEATH MATCH");\n    assert(hud.roundText == "DEATH MATCH 2");\n    assert(hud.timerText == "3 ATTEMPTS");\n    assert(hud.ownAttemptText == "Attempts : 2/3"); // side is still B\n    assert(hud.opponentAttemptText == "Attempts : 3/3");''',
              '''    input.deathmatchAttemptsUsedA = 3;\n    input.deathmatchAttemptsUsedB = 2;\n    input.deathmatchAttemptsCompletedA = 2;\n    input.deathmatchAttemptsCompletedB = 0;\n    input.spectatorActive = false;\n    hud = presentHud(input);\n    assert(hud.stateText == "DEATH MATCH");\n    assert(hud.roundText == "DEATH MATCH 2");\n    assert(hud.timerText == "3"); // side B: no authoritative End accepted yet\n    assert(!hud.qualifyingVisible);\n    assert(hud.qualifyingText.empty());\n    assert(hud.ownAttemptText == "Attempts : 2/3");\n    assert(hud.opponentAttemptText == "Attempts : 3/3");\n\n    input.deathmatchAttemptsCompletedB = 1;\n    hud = presentHud(input);\n    assert(hud.timerText == "2");\n    input.deathmatchAttemptsCompletedB = 2;\n    hud = presentHud(input);\n    assert(hud.timerText == "1");\n    input.deathmatchAttemptsCompletedB = 3;\n    hud = presentHud(input);\n    assert(hud.timerText == "0");'''
          )
          PY
          rm .github/workflows/apply-beta14-dm-hud-contract.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(client): finalize Death Match HUD contract"
          git push origin HEAD:beta14-followup-work
