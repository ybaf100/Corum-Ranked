name: Build Corum Ranked Mod

# Keep bindings and Codegen on one tested revision; the moving Codegen release
# can generate types incompatible with the manifest's Geode SDK.
# Main releases are coordinated by ranked-release.yml. Both channels and full
# validation must finish before publication; platform compilation is parallel.
# Standalone manual runs retain the same validation and immutable R2 gates.
on:
  workflow_call:
    inputs:
      prepare_only:
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.metadata.outputs.version }}
      artifact:
        value: ${{ jobs.metadata.outputs.artifact_name }}
  push:
    branches: [main]
    paths:
      - "corum-ranked-mod/**"
      - "ranked/translations/**"
      - "ranked/tools/**"
      - "ranked/packages/**"
      - "ranked/package*.json"
      - "ranked/apps/server/src/session/client-version.ts"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "corum-ranked-mod/**"
      - "ranked/translations/**"
      - "ranked/tools/**"
      - "ranked/packages/**"
      - "ranked/package*.json"
      - "ranked/apps/server/src/session/client-version.ts"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    if: inputs.prepare_only || github.ref != 'refs/heads/main' || github.event_name != 'push'
    name: Validate Ranked release manifest
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      geode_sdk: ${{ steps.version.outputs.geode_sdk }}
    steps:
      - uses: actions/checkout@v7
      - name: Read and validate mod identity/version
        id: version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('corum-ranked-mod/mod.json', 'utf8'));
          if (manifest.id !== 'hwanhee1.corum_ranked') {
            throw new Error(`Unexpected Ranked Mod ID: ${manifest.id}`);
          }
          const source = fs.readFileSync('ranked/apps/server/src/session/client-version.ts', 'utf8');
          const required = source.match(/REQUIRED_RANKED_CLIENT_VERSION\s*=\s*["']([^"']+)["']/)?.[1];
          if (!required || required !== manifest.version) {
            throw new Error(`Client/server version mismatch: mod=${manifest.version}, server=${required}`);
          }
          if (!/^\d+\.\d+\.\d+$/.test(manifest.geode)) throw new Error('Expected an exact Geode SDK version');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `geode_sdk=${manifest.geode}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${manifest.version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_name=Corum-Ranked-${manifest.version}\n`);
          NODE

  build:
    name: ${{ matrix.config.name }} ${{ needs.metadata.outputs.version }} Release
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: macOS
            os: macos-latest
            target: MacOS
          - name: iOS
            os: macos-latest
            target: iOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Build isolated Ranked release package
        id: native
        env:
          SCCACHE_C_CUSTOM_CACHE_BUSTER: ${{ hashFiles('corum-ranked-mod/CMakeLists.txt', '.github/workflows/build-ranked-mod.yml', '.github/workflows/build-ranked-debug.yml') }}-geode-${{ needs.metadata.outputs.geode_sdk }}-bindings-70986055-${{ runner.os }}-${{ matrix.config.target || 'iOS' }}-Release-debugOFF-lto-codegen-v1
        uses: geode-sdk/build-geode-mod@a0f7676e6fcd1a584f6d0c1c800239008412defc
        with:
          cli: v3.9.0
          sdk: given
          bindings-ref: 70986055f526da15318779703f0e904be822f162
          path: corum-ranked-mod
          target: ${{ matrix.config.target }}
          combine: false
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF -DCORUM_RANKED_DEBUG_BOT_MATCH=OFF -DCORUM_RANKED_DEBUG_SPECTATE=OFF
      - uses: actions/upload-artifact@v7
        with:
          name: corum-platform-release-${{ matrix.config.target }}
          path: ${{ steps.native.outputs.build-output }}/*.geode
          if-no-files-found: error

  package:
    name: Package ${{ needs.metadata.outputs.version }} Release
    runs-on: ubuntu-latest
    needs:
      - metadata
      - build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: corum-platform-release-*
          path: native-builds
      - uses: geode-sdk/cli/.github/actions/setup@9e3c4a0657fca324e0d39d10375b67e01657b775
        with:
          version: v3.9.0
      - name: Merge only the selected channel's five Native packages
        id: build
        env:
          MOD_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 corum-ranked-mod/tools/combine-ranked-packages.py native-builds release "$MOD_VERSION" combined
          echo "build-output=$GITHUB_WORKSPACE/combined" >> "$GITHUB_OUTPUT"
      - name: Normalize combined release package
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
          MOD_VERSION: ${{ needs.metadata.outputs.version }}
          RANKED_DOWNLOAD_BASE_URL: ${{ vars.RANKED_DOWNLOAD_BASE_URL }}
        shell: bash
        run: |
          mkdir -p dist
          mapfile -t PACKAGES < <(find "$BUILD_OUTPUT" -maxdepth 1 -type f -name '*.geode' -print)
          if [[ ${#PACKAGES[@]} -ne 1 ]]; then
            echo "Expected one combined Ranked release package, found ${#PACKAGES[@]}" >&2
            exit 1
          fi
          cp "${PACKAGES[0]}" "dist/hwanhee1.corum_ranked.geode"
          python3 corum-ranked-mod/tools/prepare-mod-release.py dist/hwanhee1.corum_ranked.geode release "$MOD_VERSION" dist --source-sha "$GITHUB_SHA"
          cp "dist/Corum-Ranked-$MOD_VERSION-release.geode" dist/hwanhee1.corum_ranked.geode
          python3 corum-ranked-mod/tests/verify-visibility-package.py dist/hwanhee1.corum_ranked.geode "$MOD_VERSION"
          python3 corum-ranked-mod/tests/verify-font-package.py dist/hwanhee1.corum_ranked.geode
          python3 corum-ranked-mod/tests/verify-asset-package.py --mod dist/hwanhee1.corum_ranked.geode
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}
          path: |
            dist/hwanhee1.corum_ranked.geode
            dist/release.json
          if-no-files-found: error

  publish-download:
    if: ${{ !inputs.prepare_only && github.ref == 'refs/heads/main' && (vars.RANKED_PUBLISH_R2 == 'true' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-lightsail]') || contains(github.event.head_commit.message, '[publish-r2]'))) && !contains(github.event.head_commit.message, '[build only]') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [metadata, package, tests, full-validation]
    uses: ./.github/workflows/publish-ranked-download.yml
    with:
      channel: release
      version: ${{ needs.metadata.outputs.version }}
      artifact: ${{ needs.metadata.outputs.artifact_name }}
    secrets:
      r2_access_key_id: ${{ secrets.RANKED_R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.RANKED_R2_SECRET_ACCESS_KEY }}

  tests:
    needs: metadata
    if: ${{ !inputs.prepare_only }}
    uses: ./.github/workflows/ranked-native.yml

  full-validation:
    needs: metadata
    if: ${{ !inputs.prepare_only }}
    uses: ./.github/workflows/ranked-ci.yml
    with:
      coordinated: true
