name: Validate Corum Ranked

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "ranked/**"
      - "corum-ranked-mod/**"
      - "apps-script/Code.gs"
      - "apps-script/RankedConfig.gs"
      - "apps-script/SurvivalConfig.gs"
      - "apps-script/validate-survival-config.mjs"
      - "apps-script/validate-ranked-config.mjs"
      - ".github/workflows/ranked-ci.yml"
  pull_request:
    paths:
      - "ranked/**"
      - "corum-ranked-mod/**"
      - "apps-script/Code.gs"
      - "apps-script/RankedConfig.gs"
      - "apps-script/SurvivalConfig.gs"
      - "apps-script/validate-survival-config.mjs"
      - "apps-script/validate-ranked-config.mjs"
      - ".github/workflows/ranked-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Rules, server, database, and Apps Script
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: corum_m5_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d corum_m5_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ranked/package-lock.json
      - name: Install pinned Ranked dependencies
        run: npm ci --prefix ranked
      - name: Type-check every Ranked workspace
        run: npm run typecheck --prefix ranked
      - name: Validate public release and activation checks without production access
        run: python3 -m unittest discover -s ranked/tools/tests -p 'test_*.py'
      - name: Validate authenticated GD relay Worker
        run: node --test ranked/tools/gd-relay/worker.test.mjs
      - name: Run rules and PostgreSQL integration tests
        run: npm test --prefix ranked
      - name: Simulate 1050 adaptive NORMAL matches and a ten-hour virtual soak
        run: node --expose-gc ranked/tools/simulate-survival-bots.mjs /tmp/survival-normal-simulation.json
      - name: Run Survival HTTP concurrency and recovery on PostgreSQL 16
        env:
          SURVIVAL_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/corum_m5_test
        run: npm --prefix ranked run test --workspace @corum-ranked/server -- test/survival-online.integration.test.ts
      - name: Build server and shared rules
        run: npm run build --prefix ranked
      - name: Validate additive Apps Script Ranked API
        run: node apps-script/validate-ranked-config.mjs
      - name: Validate independent Survival config and additive setup
        run: node --test apps-script/validate-survival-config.mjs
      - name: Re-run existing Apps Script compatibility checks
        run: node apps-script/validate-record-sheet-compat.mjs
