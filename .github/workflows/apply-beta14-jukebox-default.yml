name: Apply beta14 Jukebox default

on:
  push:
    branches:
      - beta14-followup-work
    paths:
      - .github/workflows/apply-beta14-jukebox-default.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta14-followup-work
          fetch-depth: 0
      - name: Insert optional Jukebox default safely
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps-script/RankedConfig.gs')
          text = path.read_text(encoding='utf-8')
          if '"fleym.nongd"' in text:
              raise SystemExit('Jukebox default already present')
          old = '''  Object.freeze([\n    "geode.node-ids",\n    "Node IDs",\n    "v1.23.3",\n    "",\n    true,\n    true,\n  ]),\n]);'''
          new = '''  Object.freeze([\n    "geode.node-ids",\n    "Node IDs",\n    "v1.23.3",\n    "",\n    true,\n    true,\n  ]),\n  Object.freeze([\n    "fleym.nongd",\n    "Jukebox",\n    "",\n    "",\n    false,\n    true,\n  ]),\n]);'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exact insertion target once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/apply-beta14-jukebox-default.yml
      - name: Commit branch-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(config): allow optional Jukebox [skip ci]"
          git push origin HEAD:beta14-followup-work
