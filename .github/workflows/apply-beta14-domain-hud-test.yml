name: Apply beta14 HUD domain test fix

on:
  push:
    branches: [beta14-followup-work]
    paths: [.github/workflows/apply-beta14-domain-hud-test.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta14-followup-work
          fetch-depth: 0
      - name: Align opponent Practice test contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('corum-ranked-mod/tests/DomainTest.cpp')
          t = p.read_text(encoding='utf-8')
          count = t.count('localPractice')
          if count != 3:
              raise SystemExit(f'expected 3 localPractice test references, found {count}')
          p.write_text(t.replace('localPractice', 'opponentPractice'), encoding='utf-8')
          PY
          rm .github/workflows/apply-beta14-domain-hud-test.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(client): assert opponent-only Practice HUD"
          git push origin HEAD:beta14-followup-work
