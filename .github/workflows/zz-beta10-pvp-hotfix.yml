name: Beta10 PVP Timeout Hotfix

on:
  push:
    branches:
      - work/beta10-pvp-timeout-hotfix
    paths:
      - .github/workflows/zz-beta10-pvp-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/beta10-pvp-timeout-hotfix
      - name: Apply hotfix
        run: python .github/beta10_pvp_hotfix.py
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranked
          git diff --cached --check
          git commit -m "candidate beta10 pvp timeout hotfix"
          git push origin HEAD:work/beta10-pvp-timeout-hotfix
