name: Beta10 Candidate Builder
on:
  push:
    branches:
      - work/beta10-placement-fixes
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'prepare beta10 candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/beta10-placement-fixes
      - name: Apply beta10 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)
          def replace_function(text, signature, replacement):
              start = text.find(signature)
              if start < 0: raise SystemExit(f'missing function: {signature}')
              brace = text.find('{', start)
              if brace < 0: raise SystemExit(f'missing function brace: {signature}')
              depth = 0
              i = brace
              while i < len(text):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          return text[:start] + replacement + text[end:]
                  i += 1
              raise SystemExit(f'unclosed function: {signature}')

          # 1) PvP prepare is exactly ten seconds; remove alpha-era 60s minimum.
          p = 'ranked/apps/server/src/match/match.service.ts'
          s = read(p)
          old = '''// alpha.10 client flow: 10s start countdown, map download may take 30s,\n// and a custom song may be allowed up to 20s. Keep server preparation\n// deadlines comfortably beyond the client-side resource window.\nconst resourcePrepareSeconds = (configuredReadySeconds: number): number =>\n  Math.max(configuredReadySeconds, 60);'''
          new = '''// PvP preparation is a real ten-second start countdown. Resource lookup, map\n// acquisition, and song acquisition begin immediately inside that window; an\n// old alpha-era 60-second safety floor must not extend the visible wait.\nconst PVP_PREPARE_SECONDS = 10;\nconst resourcePrepareSeconds = (_configuredReadySeconds: number): number =>\n  PVP_PREPARE_SECONDS;'''
          s = replace_once(s, old, new, 'PvP prepare policy')
          write(p, s)

          # 2) Grade visual wrapper must not turn transparent black into an opaque rectangle.
          p = 'corum-ranked-mod/src/ui/PlacementGradeBadge.hpp'
          s = read(p)
          s = replace_once(s, 'cocos2d::CCLayerColor* createVisual(std::string const& grade) const;', 'cocos2d::CCNode* createVisual(std::string const& grade) const;', 'grade header createVisual')
          s = replace_once(s, 'cocos2d::CCLayerColor* m_visual = nullptr;', 'cocos2d::CCNode* m_visual = nullptr;', 'grade header m_visual')
          write(p, s)

          p = 'corum-ranked-mod/src/ui/PlacementGradeBadge.cpp'
          s = read(p)
          s = replace_once(s, 'CCLayerColor* PlacementGradeBadge::createVisual(std::string const& input) const {', 'CCNode* PlacementGradeBadge::createVisual(std::string const& input) const {', 'grade cpp createVisual signature')
          s = replace_once(s, '    auto* root = CCLayerColor::create({0, 0, 0, 0});\n', '    auto* root = CCNode::create();\n', 'grade cpp transparent wrapper')
          new_set_grade = '''void PlacementGradeBadge::setGrade(std::string input, bool animate) {
    auto const next = normalizeGrade(std::move(input));
    auto const transition = m_grade.empty()
        ? PlacementGradeTransition::None
        : placementGradeTransition(m_grade, next);
    if (!m_grade.empty() && transition == PlacementGradeTransition::None) return;

    auto* oldVisual = m_visual;
    auto* nextVisual = createVisual(next);
    if (!nextVisual) return;
    addChild(nextVisual, oldVisual ? oldVisual->getZOrder() + 1 : 1);
    m_visual = nextVisual;
    m_grade = next;

    // The grade artwork already carries correct PNG alpha. Never fade a
    // CCLayerColor wrapper: setting that wrapper to opacity 255 creates the
    // black rectangle that previously appeared behind transparent grades.
    if (oldVisual) oldVisual->removeFromParentAndCleanup(true);
    nextVisual->stopAllActions();
    if (!animate || transition == PlacementGradeTransition::None) {
        nextVisual->setScale(1.0f);
        return;
    }

    if (transition == PlacementGradeTransition::Up) {
        nextVisual->setScale(0.82f);
        nextVisual->runAction(CCSequence::create(
            CCEaseSineOut::create(CCScaleTo::create(0.16f, 1.10f)),
            CCEaseSineInOut::create(CCScaleTo::create(0.12f, 1.0f)),
            nullptr
        ));
    } else {
        nextVisual->setScale(1.04f);
        nextVisual->runAction(CCEaseSineInOut::create(CCScaleTo::create(0.14f, 1.0f)));
    }
}'''
          s = replace_function(s, 'void PlacementGradeBadge::setGrade(std::string input, bool animate)', new_set_grade)
          write(p, s)

          # 3) Persisted progress is monotonic and state polling returns the same provisional evidence.
          p = 'ranked/apps/server/src/placement/placement.service.ts'
          s = read(p)
          old = '''      const updated = await transaction.query(\n        `UPDATE ranked_placement_attempts\n         SET latest_progress_percent = GREATEST(latest_progress_percent, $1)\n         WHERE id = $2 AND map_id = $3 AND ended_at IS NULL AND valid = TRUE`,\n        [body.progressPercent, body.attemptId, map.id],\n      );\n      if (updated.rowCount === 0) throw new NotFoundException("Active Placement attempt not found");'''
          new = '''      const updated = await transaction.query<{ latest_progress_percent: number }>(\n        `UPDATE ranked_placement_attempts\n         SET latest_progress_percent = GREATEST(latest_progress_percent, $1)\n         WHERE id = $2 AND map_id = $3 AND ended_at IS NULL AND valid = TRUE\n         RETURNING latest_progress_percent`,\n        [body.progressPercent, body.attemptId, map.id],\n      );\n      if (updated.rowCount === 0) throw new NotFoundException("Active Placement attempt not found");\n      const progressPercent = Number(updated.rows[0]?.latest_progress_percent ?? body.progressPercent);'''
          s = replace_once(s, old, new, 'progress persistence')
          s = replace_once(s, '''      const provisionalAttempt = scoreAttempt(\n        body.progressPercent,\n        false,\n        Number(map.qualifying_percent),\n      );''', '''      const provisionalAttempt = scoreAttempt(\n        progressPercent,\n        false,\n        Number(map.qualifying_percent),\n      );''', 'progress scoring')
          s = replace_once(s, '          progressPercent: body.progressPercent,\n', '          progressPercent,\n', 'progress evidence')

          old = '''    const activeAttempt = currentMap ? await this.database.query<PlacementAttemptRow>(\n      `SELECT id, domain_attempt_id, client_start_event_id, client_end_event_id,\n              progress_percent, cleared, awarded_score, valid, ended_at\n       FROM ranked_placement_attempts\n       WHERE map_id = $1 AND ended_at IS NULL AND valid = TRUE LIMIT 1`,\n      [currentMap.id],\n    ) : { rows: [], rowCount: 0 };\n    return {'''
          new = '''    const activeAttempt = currentMap ? await this.database.query<PlacementAttemptRow>(\n      `SELECT id, domain_attempt_id, client_start_event_id, client_end_event_id,\n              latest_progress_percent AS progress_percent, cleared, awarded_score, valid, ended_at\n       FROM ranked_placement_attempts\n       WHERE map_id = $1 AND ended_at IS NULL AND valid = TRUE LIMIT 1`,\n      [currentMap.id],\n    ) : { rows: [], rowCount: 0 };\n\n    let provisionalMapScore = currentMap ? Number(currentMap.map_score) : 0;\n    let provisionalMapGrade: PlacementGrade = currentMap?.map_grade ?? "D";\n    const active = activeAttempt.rows[0];\n    if (currentMap && active) {\n      const snapshot = await this.loadSnapshot(this.database, run.config_snapshot_id);\n      const policy = this.requirePlacementPolicy(snapshot);\n      const attempts = await this.completedAttemptEvidence(this.database, currentMap.id);\n      const progressPercent = Math.max(0, Number(active.progress_percent ?? 0));\n      const provisionalAttempt = scoreAttempt(\n        progressPercent,\n        false,\n        Number(currentMap.qualifying_percent),\n      );\n      const provisional = calculatePlacementMapScore([\n        ...attempts,\n        {\n          attemptId: `provisional:${active.id}`,\n          progressPercent,\n          cleared: false,\n          valid: true,\n          awardedScore: provisionalAttempt,\n        },\n      ], policy);\n      provisionalMapScore = provisional.mapScore;\n      provisionalMapGrade = placementGradeForMapScore(\n        provisional.mapScore,\n        policy,\n        Number(currentMap.clear_count),\n      );\n    }\n\n    return {'''
          s = replace_once(s, old, new, 'state provisional computation')
          s = replace_once(s, '        provisionalMapScore: Number(currentMap.map_score),\n        provisionalMapGrade: currentMap.map_grade,', '        provisionalMapScore,\n        provisionalMapGrade,', 'state provisional response')
          write(p, s)

          # 4) Client state polling cannot overwrite a better live grade with stale committed data.
          p = 'corum-ranked-mod/src/RankedRuntime.cpp'
          s = read(p)
          marker = '''std::string joinReasons(std::vector<std::string> const& reasons) {\n    std::string result;\n    for (auto const& reason : reasons) {\n        if (!result.empty()) result += ", ";\n        result += reason;\n    }\n    return result;\n}\n'''
          helper = marker + '''\nint placementGradeRank(std::string const& grade) {\n    if (grade == "S") return 0;\n    if (grade == "A") return 1;\n    if (grade == "B") return 2;\n    if (grade == "C") return 3;\n    return 4;\n}\n'''
          s = replace_once(s, marker, helper, 'client grade helper')
          old = '''        m_view.placement.currentMapGrade = currentMap["provisionalMapGrade"].asString().unwrapOr(\n            currentMap["mapGrade"].asString().unwrapOr("D")\n        );'''
          new = '''        auto const incomingGrade = currentMap["provisionalMapGrade"].asString().unwrapOr(\n            currentMap["mapGrade"].asString().unwrapOr("D")\n        );\n        if (\n            !hasLocalOpenAttempt() ||\n            placementGradeRank(incomingGrade) <= placementGradeRank(m_view.placement.currentMapGrade)\n        ) {\n            m_view.placement.currentMapGrade = incomingGrade;\n        }'''
          s = replace_once(s, old, new, 'client stale grade guard')
          write(p, s)

          # 5) Placement scores always show one decimal in Placement result/history UI.
          p = 'corum-ranked-mod/src/RankedPopup.cpp'
          s = read(p)
          score_marker = '''std::string formatScore(double value) {\n    if (std::abs(value - std::round(value)) < 0.0005) {\n        return std::to_string(static_cast<long long>(std::llround(value)));\n    }\n    std::ostringstream stream;\n    stream << std::fixed << std::setprecision(1) << value;\n    return stream.str();\n}\n'''
          score_helper = score_marker + '''\nstd::string formatPlacementScore(double value) {\n    std::ostringstream stream;\n    stream << std::fixed << std::setprecision(1) << value;\n    return stream.str();\n}\n'''
          s = replace_once(s, score_marker, score_helper, 'placement score formatter')

          map_result = r'''    void renderPlacementMapResult(RuntimeView const& view) {
        auto const size = CCDirector::sharedDirector()->getWinSize();
        auto const& placement = view.placement;
        auto const map1Known = placement.currentMapIndex >= 1;
        auto const map2Known = placement.currentMapIndex >= 2;
        auto const map1Score = placement.currentStageMapScores.size() > 0
            ? placement.currentStageMapScores[0]
            : (placement.currentMapIndex == 1 ? placement.currentMapScore : 0.0);
        auto const map2Score = placement.currentStageMapScores.size() > 1
            ? placement.currentStageMapScores[1]
            : (placement.currentMapIndex == 2 ? placement.currentMapScore : 0.0);
        auto const map1Grade = placement.currentStageMapGrades.size() > 0
            ? placement.currentStageMapGrades[0]
            : (placement.currentMapIndex == 1 ? placement.currentMapGrade : "?");
        auto const map2Grade = map2Known
            ? (placement.currentStageMapGrades.size() > 1 ? placement.currentStageMapGrades[1] : placement.currentMapGrade)
            : "?";
        auto const pool = view.match.currentMap ? view.match.currentMap->pool : 0;
        addScreenHeader(
            fmt::format("MAP {} {}", placement.currentMapIndex, tr("complete", "COMPLETE")),
            pool > 0
                ? fmt::format("STAGE {} · POOL {}", placement.currentStageIndex, pool)
                : fmt::format("STAGE {}", placement.currentStageIndex),
            kGold,
            kCyan
        );

        auto makeGradeCard = [&](std::string const& caption, std::string const& grade, std::string const& scoreText, float x, bool final) {
            auto* group = CCNode::create();
            group->setContentSize({88.0f, 102.0f});
            group->setAnchorPoint({0.5f, 0.5f});
            group->setPosition({x, size.height / 2.0f + 4.0f});
            auto* panel = makeNeonPanel({88.0f, 102.0f}, {44.0f, 51.0f}, final ? kGold : kBlue, kDeepPanel, 248);
            group->addChild(panel, 1);
            auto* title = makeLabel(caption, 0.20f, {44.0f, 87.0f}, final ? kGold : kCyan, "semibold");
            title->limitLabelWidth(76.0f, 0.20f, 0.14f);
            group->addChild(title, 3);
            if (grade == "?") {
                group->addChild(makeLabel("?", 0.68f, {44.0f, 53.0f}, corum::ranked::ui::TextMuted, "black"), 4);
            } else {
                auto* badge = corum::ranked::ui::PlacementGradeBadge::create(40.0f);
                if (badge) {
                    badge->setGrade(grade, false);
                    badge->setPosition({44.0f, 54.0f});
                    group->addChild(badge, 4);
                }
            }
            auto* score = makeLabel(scoreText, 0.18f, {44.0f, 16.0f}, corum::ranked::ui::TextMuted, "semibold");
            score->limitLabelWidth(76.0f, 0.18f, 0.13f);
            group->addChild(score, 4);
            m_root->addChild(group, 5);
        };

        auto const center = size.width / 2.0f;
        makeGradeCard("MAP 1", map1Grade, map1Known ? fmt::format("{} / 500", formatPlacementScore(map1Score)) : "--", center - 112.0f, false);
        makeGradeCard("MAP 2", map2Grade, map2Known ? fmt::format("{} / 500", formatPlacementScore(map2Score)) : "--", center, false);
        makeGradeCard(tr("stage-grade", "STAGE GRADE"), "?", "--", center + 112.0f, true);
        m_root->addChild(makeLabel("+", 0.48f, {center - 56.0f, size.height / 2.0f + 4.0f}, kGold, "black"), 6);
        m_root->addChild(makeLabel(">", 0.46f, {center + 56.0f, size.height / 2.0f + 4.0f}, kCyan, "black"), 6);

        addButton(
            placement.currentMapIndex == 1 ? tr("next-map", "NEXT MAP") : tr("show-stage-result", "SHOW STAGE RESULT"),
            {center, 27.0f},
            menu_selector(CorumRankedLayer::onContinuePlacement),
            false,
            0.60f
        );
    }'''
          s = replace_function(s, '    void renderPlacementMapResult(RuntimeView const& view)', map_result)

          stage_result = r'''    void renderPlacementStageResult(RuntimeView const& view) {
        auto const size = CCDirector::sharedDirector()->getWinSize();
        if (view.placement.stageResults.empty()) return;
        auto const result = view.placement.stageResults.back();
        auto const map1Grade = result.mapGrades.size() > 0 ? result.mapGrades[0] : "D";
        auto const map2Grade = result.mapGrades.size() > 1 ? result.mapGrades[1] : "D";
        auto const map1Score = result.mapScores.size() > 0 ? result.mapScores[0] : 0.0;
        auto const map2Score = result.mapScores.size() > 1 ? result.mapScores[1] : 0.0;
        auto const audioKey = fmt::format("{}:{}", view.placement.runId, result.stageIndex);
        addScreenHeader(
            fmt::format("STAGE {} {}", result.stageIndex, tr("result", "RESULT")),
            fmt::format("POOL {}", result.pool),
            kGold,
            kCyan
        );

        auto makeGradeCard = [&](std::string const& caption, std::string const& grade, double scoreValue, float x, bool final) {
            auto* group = CCNode::create();
            group->setContentSize({88.0f, 102.0f});
            group->setAnchorPoint({0.5f, 0.5f});
            group->setPosition({x, size.height / 2.0f + 4.0f});
            auto* panel = makeNeonPanel({88.0f, 102.0f}, {44.0f, 51.0f}, final ? kGold : kBlue, kDeepPanel, 248);
            group->addChild(panel, 1);
            auto* title = makeLabel(caption, 0.20f, {44.0f, 87.0f}, final ? kGold : kCyan, "semibold");
            title->limitLabelWidth(76.0f, 0.20f, 0.14f);
            group->addChild(title, 3);
            auto* badge = corum::ranked::ui::PlacementGradeBadge::create(40.0f);
            if (badge) {
                badge->setGrade(grade, false);
                badge->setPosition({44.0f, 54.0f});
                group->addChild(badge, 4);
            }
            auto* score = makeLabel(
                fmt::format("{} / 500", formatPlacementScore(scoreValue)),
                0.18f,
                {44.0f, 16.0f},
                final ? kGold : corum::ranked::ui::TextMuted,
                "semibold"
            );
            score->limitLabelWidth(76.0f, 0.18f, 0.13f);
            group->addChild(score, 4);
            m_root->addChild(group, 5);
            return group;
        };

        auto const center = size.width / 2.0f;
        auto* left = makeGradeCard("MAP 1", map1Grade, map1Score, center - 112.0f, false);
        auto* right = makeGradeCard("MAP 2", map2Grade, map2Score, center, false);
        auto* finalGroup = makeGradeCard(tr("stage-grade", "STAGE GRADE"), result.stageGrade, result.stageScore, center + 112.0f, true);
        m_root->addChild(makeLabel("+", 0.48f, {center - 56.0f, size.height / 2.0f + 4.0f}, kGold, "black"), 6);
        m_root->addChild(makeLabel(">", 0.46f, {center + 56.0f, size.height / 2.0f + 4.0f}, kCyan, "black"), 6);

        left->runAction(CCSequence::create(
            CCDelayTime::create(0.16f),
            CCEaseSineInOut::create(CCMoveBy::create(0.16f, {2.0f, 0.0f})),
            CCEaseSineInOut::create(CCMoveBy::create(0.16f, {-2.0f, 0.0f})),
            nullptr
        ));
        right->runAction(CCSequence::create(
            CCDelayTime::create(0.16f),
            CCEaseSineInOut::create(CCMoveBy::create(0.16f, {-2.0f, 0.0f})),
            CCEaseSineInOut::create(CCMoveBy::create(0.16f, {2.0f, 0.0f})),
            nullptr
        ));
        finalGroup->setScale(0.84f);
        finalGroup->runAction(CCSequence::create(
            CCDelayTime::create(0.44f),
            CCEaseSineOut::create(CCScaleTo::create(0.14f, 1.08f)),
            CCEaseSineInOut::create(CCScaleTo::create(0.12f, 1.0f)),
            nullptr
        ));
        if (m_stageResultAudioPlayedKey != audioKey) {
            finalGroup->runAction(CCSequence::create(
                CCDelayTime::create(0.44f),
                CallFuncExt::create([this, audioKey, grade = result.stageGrade] {
                    m_stageResultAudioPlayedKey = audioKey;
                    RankedAudioManager::get().setMode(
                        grade == "S" || grade == "A" || grade == "B"
                            ? RankedAudioMode::ResultWin
                            : RankedAudioMode::ResultLose
                    );
                }),
                nullptr
            ));
        }

        auto const finalStage = result.stageIndex >= view.placement.totalStages;
        addPlacementProgress(result.stageIndex, view.placement.totalStages, {center, 67.0f}, 18.0f, 0.27f);
        auto* movement = makeLabel(
            finalStage
                ? tr("all-placement-maps-complete", "ALL 10 MAPS COMPLETE")
                : fmt::format("{}  POOL {}  ({:+d})", tr("next", "NEXT"), result.nextPool, result.poolDelta),
            0.30f,
            {center, 49.0f},
            result.poolDelta > 0 ? kGreen : result.poolDelta < 0 ? kRed : corum::ranked::ui::TextMuted,
            "black"
        );
        m_root->addChild(movement, 5);
        auto* button = addButton(
            finalStage ? tr("final-placement", "FINAL PLACEMENT") : tr("next-stage", "NEXT STAGE"),
            {center + (finalStage ? 0.0f : 72.0f), 23.0f},
            menu_selector(CorumRankedLayer::onContinuePlacement),
            false,
            0.54f
        );
        button->setEnabled(false);
        button->runAction(CCSequence::create(
            CCDelayTime::create(0.76f),
            CallFuncExt::create([button] { button->setEnabled(true); }),
            nullptr
        ));
        if (!finalStage) {
            auto* later = addButton(
                tr("play-later", "PLAY LATER"),
                {center - 72.0f, 23.0f},
                menu_selector(CorumRankedLayer::onPausePlacement),
                false,
                0.54f
            );
            later->setEnabled(false);
            later->runAction(CCSequence::create(
                CCDelayTime::create(0.76f),
                CallFuncExt::create([later] { later->setEnabled(true); }),
                nullptr
            ));
        }
    }'''
          s = replace_function(s, '    void renderPlacementStageResult(RuntimeView const& view)', stage_result)

          # Placement history numeric detail uses the same fixed one-decimal formatter.
          s = s.replace('formatScore(result.stageScore)', 'formatPlacementScore(result.stageScore)')
          write(p, s)

          # 6) Beta 10 release metadata and exact server/client gate.
          for path in [
              'corum-ranked-mod/mod.json',
              'ranked/package.json',
              'ranked/apps/server/package.json',
              'ranked/packages/rules/package.json',
              'ranked/package-lock.json',
              'ranked/apps/server/src/session/client-version.ts',
              'ranked/apps/server/test/client-version.test.ts',
              'ranked/apps/server/test/debug-bot.integration.test.ts',
              'ranked/apps/server/test/placement-flow.integration.test.ts',
          ]:
              text = read(path)
              text = text.replace('v0.5.0-beta.9', 'v0.5.0-beta.10')
              text = text.replace('0.5.0-beta.9', '0.5.0-beta.10')
              write(path, text)

          p = 'corum-ranked-mod/changelog.md'
          s = read(p)
          entry = '''# v0.5.0-beta.10\n\n- Restored PvP Round and Death Match preparation to an exact ten-second countdown instead of the legacy 60-second resource floor.\n- Fixed Placement Grade rendering so transparent PNGs stay transparent, reduced Grade art sizing, and rebuilt Map/Stage results as a compact `MAP 1 + MAP 2 > STAGE GRADE` three-card layout with per-card one-decimal scores.\n- Unified live Placement provisional score/Grade evidence between progress updates and normal state polling, preserving monotonic Attempt progress and preventing D/C/B Grade oscillation from stale poll responses.\n- Kept Stage-by-Stage Placement sessions, Play Later/resume, progress dots, and Placement history while standardizing Placement score presentation to one decimal.\n- Updated the exact client/server version gate and workspace metadata to `v0.5.0-beta.10`.\n\n'''
          if not s.startswith('# v0.5.0-beta.10'):
              s = entry + s
          write(p, s)

          # Lightweight source-level regression assertions before the expensive builds.
          checks = {
              'ranked/apps/server/src/match/match.service.ts': ['const PVP_PREPARE_SECONDS = 10;', 'Math.max(configuredReadySeconds, 60)'],
              'corum-ranked-mod/src/ui/PlacementGradeBadge.cpp': ['auto* root = CCNode::create();', 'CCLayerColor* PlacementGradeBadge::createVisual'],
              'ranked/apps/server/src/placement/placement.service.ts': ['RETURNING latest_progress_percent', 'latest_progress_percent AS progress_percent'],
          }
          for path, values in checks.items():
              text = read(path)
              if values[0] not in text: raise SystemExit(f'missing expected beta10 invariant in {path}: {values[0]}')
              if values[1] in text and path != 'ranked/apps/server/src/placement/placement.service.ts':
                  raise SystemExit(f'legacy invariant still present in {path}: {values[1]}')
          PY
      - name: Run Ranked server tests and typecheck
        working-directory: ranked
        run: |
          npm ci
          npm test
          npm run typecheck
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name "ybaf100"
          git config user.email "ybaf100@gmail.com"
          git add corum-ranked-mod ranked
          git commit -m "beta10 candidate"
          git push origin HEAD:work/beta10-placement-fixes
