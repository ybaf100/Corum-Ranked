name: Beta10 Candidate Builder
on:
  push:
    branches:
      - work/beta10-placement-fixes
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'prepare beta10 candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/beta10-placement-fixes
      - name: Apply beta10 fixes
        run: python3 .github/beta10_apply.py
      - name: Run Ranked server tests and typecheck
        working-directory: ranked
        run: |
          npm ci
          npm test
          npm run typecheck
      - name: Commit candidate
        run: |
          git config user.name "ybaf100"
          git config user.email "ybaf100@gmail.com"
          git add corum-ranked-mod ranked
          git commit -m "beta10 candidate"
          git push origin HEAD:work/beta10-placement-fixes
