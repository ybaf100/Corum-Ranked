name: Corum iOS Practice Crash Diagnostics

on:
  push:
    branches: ['diagnostic/ios-practice-crash-*']
    paths:
      - 'corum-ranked-mod/src/**'
      - 'corum-ranked-mod/tests/**'
      - 'corum-ranked-mod/CMakeLists.txt'
      - 'corum-ranked-mod/mod.json'
      - 'corum-ranked-mod/diagnostics/hook-inventory-beta30.json'
      - 'corum-ranked-mod/diagnostics/player-hook-stage2.json'
      - 'corum-ranked-mod/diagnostics/player-hook-stage3.json'
      - 'corum-ranked-mod/diagnostics/player-hook-stage4.json'
      - 'corum-ranked-mod/diagnostics/verify-crash-artifact.py'
      - '.github/workflows/corum-crash-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-regression:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Source and production callback regressions
        run: node --test --test-concurrency=2 corum-ranked-mod/tests/*.mjs
      - name: Eight strict C++ executable suites
        shell: bash
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror \
            corum-ranked-mod/tests/DomainTest.cpp \
            corum-ranked-mod/src/domain/AttemptScoring.cpp \
            corum-ranked-mod/src/domain/EnvironmentPolicy.cpp \
            corum-ranked-mod/src/domain/HudPresentation.cpp \
            corum-ranked-mod/src/domain/RenderFpsMeter.cpp \
            corum-ranked-mod/src/domain/ServerClock.cpp -o /tmp/corum-domain
          /tmp/corum-domain
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror \
            corum-ranked-mod/tests/DebugBotDomainTest.cpp \
            corum-ranked-mod/src/debug/DebugBotConfig.cpp -o /tmp/corum-debug-bot
          /tmp/corum-debug-bot
          for suite in DebugSpectateDomainTest SpectatorLocalSafetyTest SpectatorRemotePolicyTest \
            SpectatorCameraPolicyTest SpectatorInterpolationBufferTest LevelPreparationTest; do
            g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror \
              "corum-ranked-mod/tests/$suite.cpp" -o "/tmp/corum-$suite"
            "/tmp/corum-$suite"
          done
      - name: Visible-only fix, crash control and production compile controls
        id: matrix
        run: >-
          python3 corum-ranked-mod/diagnostics/verify-crash-artifact.py --matrix
          --selection corum-ranked-mod/diagnostics/player-hook-stage4.json >> "$GITHUB_OUTPUT"

  ios-diagnostic:
    runs-on: macos-latest
    needs: native-regression
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-regression.outputs.matrix) }}
    name: iOS ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
      - name: Build diagnostic iOS package
        id: build
        uses: geode-sdk/build-geode-mod@586d1046506e351d1b366c7ed5e3ae1ed73bd541
        with:
          path: corum-ranked-mod
          target: iOS
          # Preserve the SDK of beta.30's geode=5.8.2 manifest. The device
          # runtime under investigation is Geode 5.10.1; it is a separate input.
          sdk: '5.8.2'
          bindings-ref: d641858f3e1cd2c6d86013c799f224ebdb8ec1cd
          combine: false
          configure-args: >-
            -DCORUM_RANKED_DEBUG_BOT_MATCH=${{ matrix.debug }}
            -DCORUM_RANKED_DEBUG_SPECTATE=${{ matrix.debug }}
            -DCORUM_CRASH_DIAG=${{ matrix.diagnostic }}
            -DCORUM_CRASH_DIAG_WORLD_OWNED_PRESENTATION=${{ matrix.world_owned }}
            -DCORUM_CRASH_DIAG_WORLD_OWNED_VISIBILITY=${{ matrix.visibility_owned }}
            -DCORUM_CRASH_DIAG_VARIANT=${{ matrix.variant }}
            ${{ matrix.exclusions }}
      - name: Label and verify the diagnostic artifact
        env:
          VARIANT: ${{ matrix.variant }}
          OUTPUT_DIR: ${{ steps.build.outputs.build-output }}
        shell: bash
        run: |
          python3 corum-ranked-mod/diagnostics/verify-crash-artifact.py \
            --variant "$VARIANT" --output "$OUTPUT_DIR" \
            --selection corum-ranked-mod/diagnostics/player-hook-stage4.json
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant }}
          path: |
            ${{ steps.build.outputs.build-output }}/*.geode
            ${{ steps.build.outputs.build-output }}/diagnostic-provenance.json
          retention-days: 14
