name: Apply beta14 server follow-up

on:
  push:
    branches:
      - beta14-followup-work
    paths:
      - .github/scripts/apply-beta14-server-followup.py
      - .github/workflows/apply-beta14-server-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta14-followup-work
          fetch-depth: 0
      - name: Apply checked replacements
        run: python .github/scripts/apply-beta14-server-followup.py
      - name: Remove one-time applier
        run: |
          rm -f beta14-server-followup.patch
          rm .github/scripts/apply-beta14-server-followup.py
          rm .github/workflows/apply-beta14-server-followup.yml
      - name: Commit branch-only implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(server): apply beta14 deathmatch lifecycle follow-up [skip ci]"
          git push origin HEAD:beta14-followup-work
