name: Apply beta14 test fixes

on:
  push:
    branches: [beta14-followup-work]
    paths: [.github/workflows/apply-beta14-test-fixes.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta14-followup-work
          fetch-depth: 0
      - name: Update lifecycle tests
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('ranked/apps/server/test/match-runtime-state.test.ts')
          t = p.read_text()
          old = '''    state.endAttempt("match-1", 2, "B", "B-2", false);\n    expect(state.progress("match-1", 2, "B")).toBeNull();\n    expect(state.displayProgress("match-1", 2, "B")).toBe(0);\n'''
          new = '''    state.endAttempt("match-1", 2, "B", "B-2", false);\n    expect(state.progress("match-1", 2, "B")).toBeNull();\n    expect(state.displayProgress("match-1", 2, "B")).toBe(31);\n    expect(state.finished("match-1", 2, "B")).toBe(true);\n'''
          if t.count(old) != 1: raise SystemExit('runtime test target mismatch')
          t = t.replace(old, new, 1)
          old2 = '''    state.beginAttempt("match-1", 2, "B", "B-3", 2_000);\n    expect(state.progress("match-1", 2, "B")?.progressPercent).toBe(0);\n    expect(state.displayProgress("match-1", 2, "B")).toBe(0);\n'''
          new2 = '''    state.beginAttempt("match-1", 2, "B", "B-3", 2_000);\n    expect(state.progress("match-1", 2, "B")?.progressPercent).toBe(0);\n    expect(state.displayProgress("match-1", 2, "B")).toBe(0);\n    expect(state.finished("match-1", 2, "B")).toBe(false);\n'''
          if t.count(old2) != 1: raise SystemExit('runtime restart target mismatch')
          p.write_text(t.replace(old2, new2, 1))

          p = Path('ranked/apps/server/test/deathmatch-flow.integration.test.ts')
          t = p.read_text()
          old = '''    const playDeathmatch = async (scoreA: number, scoreB: number) => {\n      await service.ready(matchId, matchTokenA, contextA, {\n        installedMods: structuredClone(cleanMods),\n      });\n      await service.ready(matchId, matchTokenB, contextB, {\n        installedMods: structuredClone(cleanMods),\n      });\n      const playing = (await service.state(matchId, matchTokenA, contextA)) as Record<string, any>;\n'''
          new = '''    const playDeathmatch = async (scoreA: number, scoreB: number) => {\n      let playing = (await service.state(matchId, matchTokenA, contextA)) as Record<string, any>;\n      if (playing.state === "DEATHMATCH_PREPARE") {\n        await service.ready(matchId, matchTokenA, contextA, {\n          installedMods: structuredClone(cleanMods),\n        });\n        await service.ready(matchId, matchTokenB, contextB, {\n          installedMods: structuredClone(cleanMods),\n        });\n        playing = (await service.state(matchId, matchTokenA, contextA)) as Record<string, any>;\n      }\n      expect(playing.state).toBe("DEATHMATCH_PLAYING");\n'''
          if t.count(old) != 1: raise SystemExit('deathmatch helper target mismatch')
          p.write_text(t.replace(old, new, 1))
          PY
          rm .github/workflows/apply-beta14-test-fixes.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(server): align beta14 lifecycle assertions"
          git push origin HEAD:beta14-followup-work
