name: Build Corum Ranked Debug

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "corum-ranked-mod/**"
      - "ranked/apps/server/src/session/client-version.ts"
      - ".github/workflows/build-ranked-mod.yml"
      - ".github/workflows/build-ranked-debug.yml"
  pull_request:
    paths:
      - "corum-ranked-mod/**"
      - "ranked/apps/server/src/session/client-version.ts"
      - ".github/workflows/build-ranked-mod.yml"
      - ".github/workflows/build-ranked-debug.yml"

permissions:
  contents: read

jobs:
  metadata:
    name: Validate Ranked debug manifest
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      assets_changed: ${{ steps.assets.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check external image pack inputs
        id: assets
        env:
          PACK_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
          PACK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          base="$PACK_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse --verify "${PACK_HEAD}^" 2>/dev/null || true)"
          fi
          # Compare the complete push/PR update, including deletions. With no
          # available base (for example a root commit), build the initial pack.
          changed=true
          if [[ -n "$base" ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            result=0
            git diff --quiet --no-ext-diff "$base" "$PACK_HEAD" -- \
              ':(glob)corum-ranked-mod/resources/*.png' \
              corum-ranked-mod/resources/GLOBED-LICENSE.txt \
              corum-ranked-mod/asset-pack.json \
              corum-ranked-mod/tools/build-asset-pack.py || result=$?
            case "$result" in
              0) changed=false ;;
              1) changed=true ;;
              *) exit "$result" ;;
            esac
          fi
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
          printf 'External image pack inputs changed: %s\n' "$changed"
      - name: Read and validate mod identity/version
        id: version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('corum-ranked-mod/mod.json', 'utf8'));
          if (manifest.id !== 'hwanhee1.corum_ranked') {
            throw new Error(`Unexpected Ranked Mod ID: ${manifest.id}`);
          }
          if (!manifest.dependencies?.['syzzi.click_between_frames']) {
            throw new Error('Click Between Frames must remain a required dependency');
          }
          if (!manifest.dependencies?.['geode.node-ids']) {
            throw new Error('Node IDs must remain a required dependency');
          }
          const versionSource = fs.readFileSync(
            'ranked/apps/server/src/session/client-version.ts',
            'utf8',
          );
          const requiredVersion = versionSource.match(
            /REQUIRED_RANKED_CLIENT_VERSION\s*=\s*["']([^"']+)["']/,
          )?.[1];
          if (!requiredVersion || requiredVersion !== manifest.version) {
            throw new Error(
              `Client/server version mismatch: mod=${manifest.version}, server=${requiredVersion}`,
            );
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${manifest.version}\n`);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `artifact_name=Corum-Ranked-${manifest.version}-Debug\n`,
          );
          NODE

  tests:
    name: Validate Debug Bot policy domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile with strict warnings and run
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror \
            corum-ranked-mod/tests/DomainTest.cpp \
            corum-ranked-mod/src/domain/AttemptScoring.cpp \
            corum-ranked-mod/src/domain/EnvironmentPolicy.cpp \
            corum-ranked-mod/src/domain/HudPresentation.cpp \
            corum-ranked-mod/src/domain/RenderFpsMeter.cpp \
            corum-ranked-mod/src/domain/ServerClock.cpp \
            -o /tmp/corum-ranked-domain-test
          /tmp/corum-ranked-domain-test
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror \
            corum-ranked-mod/tests/DebugBotDomainTest.cpp \
            corum-ranked-mod/src/debug/DebugBotConfig.cpp \
            -o /tmp/corum-ranked-debug-bot-domain-test
          /tmp/corum-ranked-debug-bot-domain-test
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror \
            corum-ranked-mod/tests/DebugSpectateDomainTest.cpp \
            -o /tmp/corum-ranked-debug-spectate-domain-test
          /tmp/corum-ranked-debug-spectate-domain-test
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror \
            corum-ranked-mod/tests/SpectatorLocalSafetyTest.cpp \
            -o /tmp/corum-ranked-spectator-safety-test
          /tmp/corum-ranked-spectator-safety-test
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror \
            corum-ranked-mod/tests/SpectatorRemotePolicyTest.cpp \
            -o /tmp/corum-ranked-spectator-remote-test
          /tmp/corum-ranked-spectator-remote-test
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror \
            corum-ranked-mod/tests/SpectatorCameraPolicyTest.cpp \
            -o /tmp/corum-ranked-spectator-camera-test
          /tmp/corum-ranked-spectator-camera-test
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror \
            corum-ranked-mod/tests/SpectatorInterpolationBufferTest.cpp \
            -o /tmp/corum-ranked-spectator-buffer-test
          /tmp/corum-ranked-spectator-buffer-test
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror \
            corum-ranked-mod/tests/MatchPauseBudgetTest.cpp \
            -o /tmp/corum-ranked-match-pause-test
          /tmp/corum-ranked-match-pause-test
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror \
            corum-ranked-mod/tests/LevelPreparationTest.cpp \
            -o /tmp/corum-ranked-level-prepare-test
          /tmp/corum-ranked-level-prepare-test
          node --test corum-ranked-mod/tests/GameplayControlsNativeTest.mjs
          node --test corum-ranked-mod/tests/RankedPauseNativeTest.mjs
          node --test corum-ranked-mod/tests/RankedPauseQuitNativeTest.mjs
          node --test corum-ranked-mod/tests/RankedPauseConcessionNativeTest.mjs
          node --test corum-ranked-mod/tests/RankedPauseInputNativeTest.mjs
          node --test corum-ranked-mod/tests/RankedVolumeNativeTest.mjs
          node --test corum-ranked-mod/tests/MapDetailsNativeTest.mjs
          node --test corum-ranked-mod/tests/RankAssetPackNativeTest.mjs
          python3 corum-ranked-mod/tests/AssetPackBuildTest.py
          node --test corum-ranked-mod/tests/FontTypographyNativeTest.mjs
          node --test corum-ranked-mod/tests/RoundPreparationNativeTest.mjs
          node --test corum-ranked-mod/tests/NativeEntryTransportTest.mjs
          node --test corum-ranked-mod/tests/EntryGameplayNativeTest.mjs
          node --test corum-ranked-mod/tests/RankedInputNativeTest.mjs
          node --test corum-ranked-mod/tests/EntryDeathmatchRuntimeNativeTest.mjs
          node --test corum-ranked-mod/tests/LevelPreparationSourceTest.mjs
          node --test corum-ranked-mod/tests/SpectatorCameraOwnerNativeTest.mjs
          node --test corum-ranked-mod/tests/SpectatorWorldDriverNativeTest.mjs
          node --test corum-ranked-mod/tests/SpectatorVisibilityNativeTest.mjs
          node --test corum-ranked-mod/tests/AchievementSourceTest.mjs
          node --test corum-ranked-mod/tests/SpectatorLocalSafetySourceTest.mjs
          node --test corum-ranked-mod/tests/SpectatorNativeHookTest.mjs
          node --test corum-ranked-mod/tests/PlacementRuntimeNativeTest.mjs
          node --test corum-ranked-mod/tests/SpectatorNativeInstrumentationTest.mjs
          node --test corum-ranked-mod/tests/SpectatorViewerPollingNativeTest.mjs
          node --test corum-ranked-mod/tests/SpectatorRemoteSourceTest.mjs
          node --test corum-ranked-mod/tests/SpectatorRemoteNativeTest.mjs
          node --test corum-ranked-mod/tests/SpectatorCameraSourceTest.mjs
          node --test corum-ranked-mod/tests/SpectatorSceneNativeTest.mjs
          node --test corum-ranked-mod/tests/SpectatorLiveViewerNativeTest.mjs
          node --test corum-ranked-mod/tests/SpectatorPublisherNativeTest.mjs
          node --test corum-ranked-mod/tests/SpectatorAudioNativeTest.mjs
          node --test corum-ranked-mod/tests/AudioTransitionSourceTest.mjs
          node --test corum-ranked-mod/tests/RankedAudioTransitionNativeTest.mjs
          node --test corum-ranked-mod/tests/SpectatorCaptureNativeTest.mjs
          node --test corum-ranked-mod/tests/DebugSpectateSourceTest.mjs
          node --test corum-ranked-mod/tests/DebugSpectateRuntimeNativeTest.mjs

  build:
    name: ${{ matrix.config.name }} Debug ${{ needs.metadata.outputs.version }}
    needs:
      - metadata
      - tests
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: iOS
            os: macos-latest
            target: iOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Build Debug Bot package
        uses: geode-sdk/build-geode-mod@main
        with:
          path: corum-ranked-mod
          target: ${{ matrix.config.target }}
          combine: true
          configure-args: -DCORUM_RANKED_DEBUG_BOT_MATCH=ON -DCORUM_RANKED_DEBUG_SPECTATE=ON

  ios-debug-off:
    name: Validate iOS Debug OFF ${{ needs.metadata.outputs.version }}
    needs:
      - metadata
      - tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile official iOS configuration
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: corum-ranked-mod
          target: iOS
          combine: false
          configure-args: -DCORUM_RANKED_DEBUG_BOT_MATCH=OFF -DCORUM_RANKED_DEBUG_SPECTATE=OFF
      - name: Verify packaged iOS detours and Debug exclusion
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
          MOD_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          python3 corum-ranked-mod/tests/verify-visibility-package.py \
            "$BUILD_OUTPUT" "$MOD_VERSION" --ios-only
          python3 corum-ranked-mod/tests/verify-font-package.py "$BUILD_OUTPUT"
          find "$BUILD_OUTPUT" -name '*.geode' -exec python3 corum-ranked-mod/tests/verify-asset-package.py --mod {} \;
      - uses: actions/upload-artifact@v7
        with:
          name: Corum-Ranked-${{ needs.metadata.outputs.version }}-iOS-Debug-OFF
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error

  package:
    name: Package Debug ${{ needs.metadata.outputs.version }}
    runs-on: ubuntu-latest
    needs:
      - metadata
      - build
    steps:
      - uses: actions/checkout@v7
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - name: Normalize and validate combined Debug package
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
          MOD_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          mapfile -t PACKAGES < <(find "$BUILD_OUTPUT" -maxdepth 1 -type f -name '*.geode' -print)
          if [[ ${#PACKAGES[@]} -ne 1 ]]; then
            echo "Expected one combined Ranked Debug package, found ${#PACKAGES[@]}" >&2
            exit 1
          fi
          cp "${PACKAGES[0]}" "dist/hwanhee1.corum_ranked.geode"
          python3 - "dist/hwanhee1.corum_ranked.geode" "$MOD_VERSION" <<'PY'
          import json
          import sys
          import zipfile

          package_path, expected_version = sys.argv[1:]
          with zipfile.ZipFile(package_path) as package:
              manifest = json.loads(package.read("mod.json"))
              files = set(package.namelist())
          if manifest.get("id") != "hwanhee1.corum_ranked":
              raise SystemExit(f"Unexpected Mod ID: {manifest.get('id')}")
          if manifest.get("version") != expected_version:
              raise SystemExit(
                  f"Package version {manifest.get('version')} does not match {expected_version}"
              )
          expected_binaries = {
              "hwanhee1.corum_ranked.dll",
              "hwanhee1.corum_ranked.ios.dylib",
              "hwanhee1.corum_ranked.android32.so",
              "hwanhee1.corum_ranked.android64.so",
          }
          missing = sorted(expected_binaries - files)
          if missing:
              raise SystemExit("Combined package is missing: " + ", ".join(missing))
          PY
          python3 corum-ranked-mod/tests/verify-visibility-package.py \
            dist/hwanhee1.corum_ranked.geode "$MOD_VERSION" --debug
          python3 corum-ranked-mod/tests/verify-font-package.py dist/hwanhee1.corum_ranked.geode
          python3 corum-ranked-mod/tests/verify-asset-package.py --mod dist/hwanhee1.corum_ranked.geode
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}
          path: dist/hwanhee1.corum_ranked.geode
          if-no-files-found: error

      - name: Report Debug artifact filename
        shell: bash
        run: |
          echo "Debug artifact ZIP: ${{ needs.metadata.outputs.artifact_name }}.zip" >> "$GITHUB_STEP_SUMMARY"

  assets:
    name: Package external Ranked images
    runs-on: ubuntu-latest
    needs:
      - metadata
      - package
    if: needs.metadata.outputs.assets_changed == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Build deterministic single image ZIP and server metadata
        id: pack
        run: |
          python3 corum-ranked-mod/tools/build-asset-pack.py --output asset-pack-dist
          python3 corum-ranked-mod/tests/verify-asset-package.py \
            --pack asset-pack-dist/Corum-Ranked-Assets.zip \
            --metadata asset-pack-dist/asset-pack-metadata.json
          python3 - <<'PY'
          import json, os
          metadata = json.load(open('asset-pack-dist/asset-pack-metadata.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + metadata['releaseTag'] + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('External pack: ' + metadata['releaseTag'] + ' / ' + str(metadata['client']['assets']['sizeBytes']) + ' bytes\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: Corum-Ranked-Assets-${{ steps.pack.outputs.tag }}
          path: asset-pack-dist/*
          if-no-files-found: error
