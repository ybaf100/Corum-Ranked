name: Apply beta14 asset resolver and transition trace

on:
  push:
    branches: [beta14-followup-work]
    paths: [.github/workflows/apply-beta14-assets-trace.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta14-followup-work
          fetch-depth: 0
      - name: Wire resolver and tracer
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path); t = p.read_text(encoding='utf-8')
              n = t.count(old)
              if n != 1: raise SystemExit(f'{path}: expected target once, found {n}: {old[:80]!r}')
              p.write_text(t.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'corum-ranked-mod/src/ui/RankedVisuals.hpp',
              '#pragma once\n\n#include <Geode/Geode.hpp>',
              '#pragma once\n\n#include "RankAssetPackManager.hpp"\n\n#include <Geode/Geode.hpp>'
          )
          replace_once(
              'corum-ranked-mod/src/ui/RankedVisuals.hpp',
              '    auto const path = Mod::get()->getResourcesDir() / filename;\n    CCSprite* result = nullptr;',
              '    auto const path = rankedVisualResourcePath(filename);\n    CCSprite* result = nullptr;'
          )
          replace_once(
              'corum-ranked-mod/src/ui/RankBadgeAssets.cpp',
              '#include "RankedVisuals.hpp"',
              '#include "RankedVisuals.hpp"\n#include "../domain/TransitionTrace.hpp"'
          )
          replace_once(
              'corum-ranked-mod/src/ui/RankBadgeAssets.cpp',
              'CCSprite* rankResourceSprite(std::string const& filename) {\n    auto const path = Mod::get()->getResourcesDir() / filename;\n    if (!std::filesystem::exists(path)) return nullptr;\n    return CCSprite::create(path.string().c_str());\n}',
              '''CCSprite* rankResourceSprite(std::string const& filename) {\n    auto const path = rankedVisualResourcePath(filename);\n    if (path.empty() || !std::filesystem::exists(path)) return nullptr;\n    auto const started = std::chrono::steady_clock::now();\n    auto* sprite = CCSprite::create(path.string().c_str());\n    auto const elapsedUs = std::chrono::duration_cast<std::chrono::microseconds>(\n        std::chrono::steady_clock::now() - started\n    ).count();\n    TransitionTrace::get().mark(fmt::format("texture-decode:{}:{}us", filename, elapsedUs));\n    return sprite;\n}'''
          )
          replace_once(
              'corum-ranked-mod/src/ui/RankBadgeAssets.cpp',
              '#include <cctype>\n#include <filesystem>',
              '#include <cctype>\n#include <chrono>\n#include <filesystem>'
          )

          replace_once(
              'corum-ranked-mod/src/RankedRuntime.cpp',
              '#include "domain/AttemptScoring.hpp"',
              '#include "domain/AttemptScoring.hpp"\n#include "domain/TransitionTrace.hpp"'
          )
          replace_once(
              'corum-ranked-mod/src/RankedRuntime.cpp',
              '''    if (previousState != m_view.placement.state) {\n        log::info("Corum Ranked Placement state: {} -> {}", previousState, m_view.placement.state);\n    }''',
              '''    if (previousState != m_view.placement.state) {\n        log::info("Corum Ranked Placement state: {} -> {}", previousState, m_view.placement.state);\n        TransitionTrace::get().begin(\n            fmt::format("{}:{}->{}", m_view.match.matchId, previousState, m_view.placement.state),\n            "server-state-received"\n        );\n    }'''
          )
          replace_once(
              'corum-ranked-mod/src/RankedRuntime.cpp',
              '''    if (previousState != m_view.match.state) {\n        log::info("Corum Ranked state: {} -> {}", previousState, m_view.match.state);\n    }''',
              '''    if (previousState != m_view.match.state) {\n        log::info("Corum Ranked state: {} -> {}", previousState, m_view.match.state);\n        TransitionTrace::get().begin(\n            fmt::format("{}:{}->{}", m_view.match.matchId, previousState, m_view.match.state),\n            "server-state-received"\n        );\n    }'''
          )

          replace_once(
              'corum-ranked-mod/src/RankedAudioManager.cpp',
              '#include "RankedAudioManager.hpp"',
              '#include "RankedAudioManager.hpp"\n#include "domain/TransitionTrace.hpp"'
          )
          replace_once(
              'corum-ranked-mod/src/RankedAudioManager.cpp',
              '    m_desiredMode = mode;\n    requestAudioSwitch();',
              '    m_desiredMode = mode;\n    TransitionTrace::get().mark("audio-mode-request");\n    requestAudioSwitch();'
          )
          replace_once(
              'corum-ranked-mod/src/RankedAudioManager.cpp',
              '    m_preparedSounds[songId] = sound;\n    log::info("Ranked audio prewarmed song={} duration={}us path=\'{}\'", songId, elapsedUs, path);',
              '    m_preparedSounds[songId] = sound;\n    TransitionTrace::get().mark(fmt::format("audio-prewarm:{}:{}us", songId, elapsedUs));\n    log::info("Ranked audio prewarmed song={} duration={}us path=\'{}\'", songId, elapsedUs, path);'
          )
          replace_once(
              'corum-ranked-mod/src/RankedAudioManager.cpp',
              '    m_rankedSound = sound;\n    m_rankedChannel = channel;',
              '    m_rankedSound = sound;\n    m_rankedChannel = channel;\n    TransitionTrace::get().mark("audio-channel-started");'
          )

          replace_once(
              'corum-ranked-mod/src/PlayLayer.cpp',
              '#include "domain/RankedGameplayPolicy.hpp"',
              '#include "domain/RankedGameplayPolicy.hpp"\n#include "domain/TransitionTrace.hpp"'
          )
          replace_once(
              'corum-ranked-mod/src/PlayLayer.cpp',
              '''        runtime.tick();\n        if (!m_fields->rankedLevel || m_isTestMode) return;\n        m_fields->gameplayFrameObserved = true;''',
              '''        runtime.tick();\n        if (!m_fields->rankedLevel || m_isTestMode) return;\n        if (!m_fields->gameplayFrameObserved) {\n            corum::ranked::TransitionTrace::get().mark("first-gameplay-frame");\n        }\n        m_fields->gameplayFrameObserved = true;'''
          )

          replace_once(
              'corum-ranked-mod/src/RankedPopup.cpp',
              '#include "domain/PlacementStageMerge.hpp"',
              '#include "domain/PlacementStageMerge.hpp"\n#include "domain/TransitionTrace.hpp"'
          )
          replace_once(
              'corum-ranked-mod/src/RankedPopup.cpp',
              '        auto const timeline = corum::ranked::placementStageMergeTimeline();',
              '        auto const timeline = corum::ranked::placementStageMergeTimeline();\n        corum::ranked::TransitionTrace::get().mark("stage-merge-node-build");'
          )
          PY
          rm .github/workflows/apply-beta14-assets-trace.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(client): wire external assets and transition tracing"
          git push origin HEAD:beta14-followup-work
