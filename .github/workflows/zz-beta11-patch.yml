name: Beta11 PVP Ready Race Patch

on:
  push:
    branches:
      - work/beta11-pvp-ready-race
    paths:
      - .github/workflows/zz-beta11-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/beta11-pvp-ready-race
      - name: Apply beta11 patch
        run: python .github/beta11_apply.py
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corum-ranked-mod ranked
          git diff --cached --check
          git commit -m "candidate beta11 pvp ready race fix"
          git push origin HEAD:work/beta11-pvp-ready-race
